[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jury-central"
version = "0.1.0"
description = "Application de gestion de jurys"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "ReC82" },
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "markdown>=3.7",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.17",
    "sympy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
seed-db = "app.seed:seed"
reset-db = "app.seed:reset"

[tool.hatch.build.targets.wheel]
packages = ["app", "generators"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
