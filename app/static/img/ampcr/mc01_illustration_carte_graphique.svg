  <rect x="50" y="195" width="30" height="50" rx="4" fill="#f8f9fa" stroke="#343a40" stroke-width="3"/>
  <g fill="#343a40">
    <circle cx="60" cy="210" r="2.5"/><circle cx="70" cy="210" r="2.5"/>
    <circle cx="60" cy="222" r="2.5"/><circle cx="70" cy="222" r="2.5"/>
    <circle cx="60" cy="234" r="2.5"/><circle cx="70" cy="234" r="2.5"/>
  </g>

  <!-- Circuit imprimé -->
  <rect x="90" y="60" width="540" height="240" rx="8" fill="#1864ab"/>
  <g fill="#ffd43b">
    <rect x="150" y="300" width="18" height="30"/><rect x="172" y="300" width="18" height="30"/>
    <rect x="194" y="300" width="18" height="30"/><rect x="216" y="300" width="18" height="30"/>
    <rect x="260" y="300" width="18" height="30"/><rect x="282" y="300" width="18" height="30"/>
    <rect x="304" y="300" width="18" height="30"/><rect x="326" y="300" width="18" height="30"/>
    <rect x="348" y="300" width="18" height="30"/><rect x="370" y="300" width="18" height="30"/>
    <rect x="392" y="300" width="18" height="30"/><rect x="414" y="300" width="18" height="30"/>
    <rect x="436" y="300" width="18" height="30"/><rect x="458" y="300" width="18" height="30"/>
  </g>
  <rect x="566" y="40" width="44" height="24" rx="3" fill="#212529"/>
  <g fill="#495057"><rect x="572" y="46" width="8" height="12"/><rect x="584" y="46" width="8" height="12"/><rect x="596" y="46" width="8" height="12"/></g>

  <!-- Carénage et ventilateurs -->
  <rect x="110" y="70" width="505" height="215" rx="22" fill="#343a40"/>
  <path d="M110 120 H615" stroke="#fa5252" stroke-width="6"/>
  <g>
    <circle cx="245" cy="185" r="88" fill="#212529" stroke="#868e96" stroke-width="4"/>
    <g fill="#495057">
