<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="gpu-title">
  <title id="gpu-title">Illustration d'un composant d'ordinateur vu de face</title>
  <rect width="680" height="400" fill="#f1f3f5"/>
  <ellipse cx="350" cy="352" rx="290" ry="18" fill="#dee2e6"/>

  <!-- Équerre métallique avec sorties -->
