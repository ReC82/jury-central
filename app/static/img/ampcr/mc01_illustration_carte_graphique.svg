  </g>
  <g>
    <circle cx="480" cy="185" r="88" fill="#212529" stroke="#868e96" stroke-width="4"/>
    <g fill="#495057">
      <path d="M480 185 C 490 140, 525 120, 535 140 C 525 160, 500 175, 480 185 Z"/>
