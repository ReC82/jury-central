<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="mb-title mb-desc">
  <title id="mb-title">Schéma simplifié d'une carte mère, vue de dessus, avec six repères lettrés A à F</title>
  <desc id="mb-desc">Schéma technique d'une carte mère au format tour. Six éléments sont désignés par des repères lettrés de A à F reliés par un trait à l'élément concerné.</desc>
  <defs>
    <pattern id="mb-pins" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.6" fill="#c9a227"/>
    </pattern>
    <pattern id="mb-fins" width="10" height="90" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="5" height="90" fill="#9aa5ad"/>
    </pattern>
  </defs>

  <!-- Circuit imprimé -->
  <rect x="60" y="30" width="520" height="640" rx="14" fill="#2d6a4f" stroke="#1b4332" stroke-width="4"/>
  <g stroke="#40916c" stroke-width="2" fill="none" opacity="0.7">
    <path d="M300 280 V380 H420"/>
    <path d="M330 280 V350 H470 V470"/>
    <path d="M200 200 H130"/>
    <path d="M300 420 V470 H430"/>
    <path d="M520 430 V520"/>
  </g>
  <g fill="#e9ecef">
    <circle cx="85" cy="55" r="7"/><circle cx="555" cy="55" r="7"/>
    <circle cx="85" cy="645" r="7"/><circle cx="555" cy="645" r="7"/>
  </g>

  <!-- Panneau d'entrées/sorties arrière -->
  <rect x="62" y="70" width="70" height="250" fill="#adb5bd" stroke="#495057" stroke-width="3"/>
  <g fill="#343a40">
    <rect x="76" y="88" width="42" height="18" rx="2"/>
    <rect x="76" y="114" width="42" height="18" rx="2"/>
    <rect x="76" y="148" width="42" height="34" rx="3"/>
    <rect x="76" y="196" width="42" height="18" rx="2"/>
    <rect x="76" y="222" width="42" height="18" rx="2"/>
    <circle cx="86" cy="270" r="7"/><circle cx="108" cy="270" r="7"/>
    <circle cx="86" cy="296" r="7"/><circle cx="108" cy="296" r="7"/>
  </g>

  <!-- Socket du processeur -->
  <rect x="200" y="90" width="170" height="170" fill="#dee2e6" stroke="#343a40" stroke-width="4"/>
  <rect x="220" y="110" width="130" height="130" fill="#212529"/>
  <rect x="220" y="110" width="130" height="130" fill="url(#mb-pins)"/>
  <path d="M220 110 l14 0 l-14 14 z" fill="#ffd43b"/>

  <!-- Emplacements mémoire -->
  <g stroke="#212529" stroke-width="2">
    <rect x="420" y="70" width="16" height="320" rx="3" fill="#1c7ed6"/>
    <rect x="446" y="70" width="16" height="320" rx="3" fill="#343a40"/>
    <rect x="472" y="70" width="16" height="320" rx="3" fill="#1c7ed6"/>
    <rect x="498" y="70" width="16" height="320" rx="3" fill="#343a40"/>
  </g>
  <g fill="#f8f9fa">
    <rect x="422" y="64" width="12" height="8"/><rect x="448" y="64" width="12" height="8"/>
    <rect x="474" y="64" width="12" height="8"/><rect x="500" y="64" width="12" height="8"/>
    <rect x="422" y="388" width="12" height="8"/><rect x="448" y="388" width="12" height="8"/>
    <rect x="474" y="388" width="12" height="8"/><rect x="500" y="388" width="12" height="8"/>
  </g>

  <!-- Emplacements d'extension -->
  <rect x="120" y="430" width="330" height="20" rx="3" fill="#212529" stroke="#868e96" stroke-width="2"/>
  <rect x="160" y="436" width="250" height="8" fill="#495057"/>
  <rect x="120" y="500" width="120" height="16" rx="3" fill="#212529" stroke="#868e96" stroke-width="2"/>
  <rect x="120" y="570" width="330" height="20" rx="3" fill="#212529" stroke="#868e96" stroke-width="2"/>
  <rect x="160" y="576" width="250" height="8" fill="#495057"/>

  <!-- Chipset avec dissipateur -->
  <rect x="460" y="470" width="90" height="90" rx="6" fill="#ced4da" stroke="#495057" stroke-width="3"/>
  <rect x="465" y="470" width="80" height="90" fill="url(#mb-fins)"/>

  <!-- Connecteurs de stockage -->
  <g fill="#e03131" stroke="#7d1d1d" stroke-width="2">
    <rect x="540" y="590" width="30" height="16" rx="2"/>
    <rect x="540" y="612" width="30" height="16" rx="2"/>
    <rect x="505" y="590" width="30" height="16" rx="2"/>
    <rect x="505" y="612" width="30" height="16" rx="2"/>
  </g>

  <!-- Repères -->
  <g stroke="#ffffff" stroke-width="3">
    <line x1="285" y1="440" x2="300" y2="660"/>
    <line x1="514" y1="230" x2="605" y2="230"/>
    <line x1="285" y1="175" x2="285" y2="20"/>
    <line x1="505" y1="515" x2="615" y2="470"/>
    <line x1="97" y1="195" x2="25" y2="195"/>
    <line x1="537" y1="609" x2="615" y2="560"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="664" r="20" fill="#ffd43b" stroke="#212529" stroke-width="3"/>
    <text x="300" y="672" fill="#212529">A</text>
    <circle cx="612" cy="230" r="20" fill="#ffd43b" stroke="#212529" stroke-width="3"/>
    <text x="612" y="238" fill="#212529">B</text>
    <circle cx="285" cy="22" r="20" fill="#ffd43b" stroke="#212529" stroke-width="3"/>
    <text x="285" y="30" fill="#212529">C</text>
    <circle cx="615" cy="466" r="20" fill="#ffd43b" stroke="#212529" stroke-width="3"/>
    <text x="615" y="474" fill="#212529">D</text>
    <circle cx="25" cy="195" r="20" fill="#ffd43b" stroke="#212529" stroke-width="3"/>
    <text x="25" y="203" fill="#212529">E</text>
    <circle cx="615" cy="556" r="20" fill="#ffd43b" stroke="#212529" stroke-width="3"/>
    <text x="615" y="564" fill="#212529">F</text>
  </g>
</svg>
