<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t">
<title id="t">Deux bénévoles réparent un vélo installé sur un pied d'atelier ; des outils sont accrochés au mur derrière eux.</title>
<!-- Dessin vectoriel original, ticket #129 : fond, mur, panneau à outils -->
<rect width="640" height="420" fill="#fdf6e9"/>
<rect x="0" y="330" width="640" height="90" fill="#e9dcc4"/>
<rect x="150" y="38" width="340" height="150" rx="10" fill="#d8c3a0"/>
<g fill="#c4ab84">
<circle cx="180" cy="62" r="3"/><circle cx="220" cy="62" r="3"/><circle cx="260" cy="62" r="3"/><circle cx="300" cy="62" r="3"/><circle cx="340" cy="62" r="3"/><circle cx="380" cy="62" r="3"/><circle cx="420" cy="62" r="3"/><circle cx="460" cy="62" r="3"/>
<circle cx="180" cy="164" r="3"/><circle cx="220" cy="164" r="3"/><circle cx="260" cy="164" r="3"/><circle cx="300" cy="164" r="3"/><circle cx="340" cy="164" r="3"/><circle cx="380" cy="164" r="3"/><circle cx="420" cy="164" r="3"/><circle cx="460" cy="164" r="3"/>
</g>
<!-- clé plate -->
<g transform="translate(196 74) rotate(8)"><rect x="-6" y="0" width="12" height="80" rx="5" fill="#6b7a89"/><circle cx="0" cy="0" r="14" fill="#6b7a89"/><rect x="-5" y="-16" width="10" height="16" fill="#d8c3a0"/></g>
