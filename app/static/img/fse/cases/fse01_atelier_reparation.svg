<circle cx="248" cy="262" r="6" fill="#2b3440"/><circle cx="404" cy="262" r="6" fill="#2b3440"/><circle cx="320" cy="262" r="10" fill="#55606b"/>
<!-- bénévole 1 (à gauche, accroupi, tient une clé près de la roue arrière) -->
<g>
<circle cx="126" cy="196" r="24" fill="#8d5b3c"/>
