<g transform="translate(366 74)"><path d="M-10 0 L-3 46 L-12 96" stroke="#2f7d6d" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M10 0 L3 46 L12 96" stroke="#2f7d6d" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="0" cy="46" r="6" fill="#55606b"/></g>
