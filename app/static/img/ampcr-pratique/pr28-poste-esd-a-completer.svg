<svg viewBox="0 0 400 274" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Poste de travail antistatique à compléter</title><desc>Schéma à compléter d&#x27;un poste de travail vu de face, cinq numéros sans légende : 1 sur la bande posée sur le plan de travail ; 2 sur le cordon qui descend du bord gauche de cette bande vers un symbole de masse ; 3 sur l&#x27;anneau au poignet, dont un cordon pointillé rejoint la bande ; 4 sur le câble qui part du PC ouvert et s&#x27;arrête, marqué d&#x27;une croix, avant la prise murale ; 5 sur la petite pochette posée à côté du PC.</desc><rect x="20" y="170" width="300" height="14" fill="#d9dde6" stroke="#33415c" stroke-width="1.5"/><rect x="30" y="162" width="280" height="8" fill="#9fb7d9" stroke="#33415c" stroke-width="1.5"/><rect x="30" y="184" width="10" height="56" fill="#d9dde6" stroke="#33415c" stroke-width="1.5"/><rect x="300" y="184" width="10" height="56" fill="#d9dde6" stroke="#33415c" stroke-width="1.5"/><rect x="170" y="92" width="80" height="70" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><rect x="180" y="102" width="40" height="30" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><text x="210" y="152" font-size="10.5" font-weight="400" text-anchor="middle">PC ouvert</text><path d="M250 140 H300 V120 H328" fill="none" stroke="#33415c" stroke-width="2"/><rect x="328" y="113" width="14" height="14" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><rect x="362" y="104" width="26" height="32" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="375" y="150" font-size="10.5" font-weight="400" text-anchor="middle">prise</text><text x="352" y="125" font-size="14" font-weight="700" text-anchor="middle">✗</text><ellipse cx="90" cy="70" rx="22" ry="10" fill="#ffffff" stroke="#33415c" stroke-width="2"/><path d="M90 80 C90 120 70 130 70 160" fill="none" stroke="#33415c" stroke-width="1.5" stroke-dasharray="4 2"/><circle cx="70" cy="164" r="3" fill="#33415c"/><text x="90" y="52" font-size="10.5" font-weight="400" text-anchor="middle">poignet</text><path d="M40 166 H10 V250" fill="none" stroke="#33415c" stroke-width="1.5"/><path d="M0 250 H20 M4 256 H16 M8 262 H12" stroke="#33415c" stroke-width="2"/><rect x="262" y="132" width="34" height="30" rx="3" fill="#e6e0f2" stroke="#33415c" stroke-width="1.5"/><circle data-badge="1" cx="130" cy="156" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="130" y="160" font-size="11.5" font-weight="700" text-anchor="middle">1</text><circle data-badge="2" cx="24" cy="210" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="24" y="214" font-size="11.5" font-weight="700" text-anchor="middle">2</text><circle data-badge="3" cx="122" cy="70" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="122" y="74" font-size="11.5" font-weight="700" text-anchor="middle">3</text><circle data-badge="4" cx="345" cy="140" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="345" y="144" font-size="11.5" font-weight="700" text-anchor="middle">4</text><circle data-badge="5" cx="279" cy="120" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="279" y="124" font-size="11.5" font-weight="700" text-anchor="middle">5</text></svg>
