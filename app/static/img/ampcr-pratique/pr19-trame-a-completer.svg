ht="700" text-anchor="middle">④ ?</text><text x="344" y="96" font-size="10" font-weight="400" text-anchor="middle">4 o</text><text x="8" y="126" font-size="10.5" font-weight="400" text-anchor="start">Trame de 64 à 1 518 octets, préambule de 8 octets non compté.</text></svg>
