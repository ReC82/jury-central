<svg viewBox="0 0 380 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Quatre topologies à nommer</title><desc>Quatre cases numérotées, sans nom. ① cinq PC reliés chacun au suivant, le dernier au premier. ② quatre routeurs R1 à R4, chacun relié aux trois autres. ③ un câble horizontal fermé par un bouchon à chaque bout, quatre PC branchés dessus. ④ un switch au centre relié par un câble distinct à cinq PC.</desc><g><rect x="4" y="4" width="184" height="152" rx="6" fill="#f4f6fb" stroke="#c4cad6"/><path data-link="ring-1" d="M96.0 18.0 L141.7 51.2" stroke="#33415c" stroke-width="1.6"/><path data-link="ring-2" d="M141.7 51.2 L124.2 104.8" stroke="#33415c" stroke-width="1.6"/><path data-link="ring-3" d="M124.2 104.8 L67.8 104.8" stroke="#33415c" stroke-width="1.6"/><path data-link="ring-4" d="M67.8 104.8 L50.3 51.2" stroke="#33415c" stroke-width="1.6"/><path data-link="ring-5" d="M50.3 51.2 L96.0 18.0" stroke="#33415c" stroke-width="1.6"/><rect x="81.0" y="8.0" width="30" height="20" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="96.0" y="22.0" font-size="9.5" font-weight="700" text-anchor="middle">PC</text><rect x="126.7" y="41.2" width="30" height="20" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="141.7" y="55.2" font-size="9.5" font-weight="700" text-anchor="middle">PC</text><rect x="109.2" y="94.8" width="30" height="20" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="124.2" y="108.8" font-size="9.5" font-weight="700" text-anchor="middle">PC</text><rect x="52.8" y="94.8" width="30" height="20" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="67.8" y="108.8" font-size="9.5" font-weight="700" text-anchor="middle">PC</text><rect x="35.3" y="41.2" width="30" height="20" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="50.3" y="55.2" font-size="9.5" font-weight="700" text-anchor="middle">P