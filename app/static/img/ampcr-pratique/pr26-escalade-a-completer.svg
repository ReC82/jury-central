<svg viewBox="0 0 380 628" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Arbre d&#x27;escalade à compléter</title><desc>Arbre d&#x27;escalade : 1. Aucun signe d&#x27;incident de sécurité (virus, intrusion, fuite de données) ? Si non : ① ; 2. L&#x27;action reste dans mon rôle et mes droits ? Si non : ② ; 3. Les données sont sauvegardées ou ne sont pas menacées ? Si non : ③ ; 4. J&#x27;ai la compétence, les pièces et l&#x27;outillage ? Si non : Escalader au niveau 2, au fabricant (garantie) ou au prestataire (copieur, Internet). ; 5. Durée et coût restent dans l&#x27;estimation acceptée ? Si non : ④ Si tout est oui : Intervenir selon le plan d&#x27;action accepté, puis vérifier les critères de réussite.</desc><rect data-step="1" x="6" y="8" width="178" height="103" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="26" font-size="12" font-weight="700" text-anchor="start">1. Aucun signe</text><text x="14" y="41" font-size="12" font-weight="700" text-anchor="start">d&#x27;incident de</text><text x="14" y="56" font-size="12" font-weight="700" text-anchor="start">sécurité (virus,</text><text x="14" y="71" font-size="12" font-weight="700" text-anchor="start">intrusion, fuite de</text><text x="14" y="86" font-size="12" font-weight="700" text-anchor="start">données)</text><rect x="210" y="8" width="164" height="103" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="26" font-size="11.5" font-weight="400" text-anchor="start">①</text><path d="M184 59 H206" stroke="#33415c" stroke-width="2"/><path d="M200 53 L208 59 L200 65" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="74" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 113 V133" stroke="#33415c" stroke-width="2"/><path d="M89 127 L95 135 L101 127" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="129" font-size="10.5" font-weight="700">OUI</text><rect data-step="2" x="6" y="137" width="178" height="73" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="155" font-size="12" font-weight="700" text-anchor="start">2. L&#x27;action reste dans</text><text x="14" y="170" font-size="12" font-weight="700" text-anchor="start">mon rôle et mes</text><text x="14" y="185" font-size="12" font-weight="700" text-anchor="start">droits</text><rect x="210" y="137" width="164" height="73" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="155" font-size="11.5" font-weight="400" text-anchor="start">②</text><path d="M184 173 H206" stroke="#33415c" stroke-width="2"/><path d="M200 167 L208 173 L200 179" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="188" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 212 V232" stroke="#33415c" stroke-width="2"/><path d="M89 226 L95 234 L101 226" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="228" font-size="10.5" font-weight="700">OUI</text><rect data-step="3" x="6" y="236" width="178" height="73" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="254" font-size="12" font-weight="700" text-anchor="start">3. Les données sont</text><text x="14" y="269" font-size="12" font-weight="700" text-anchor="start">sauvegardées ou ne</text><text x="14" y="284" font-size="12" font-weight="700" text-anchor="start">sont pas menacées</text><rect x="210" y="236" width="164" height="73" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="254" font-size="11.5" font-weight="400" text-anchor="start">③</text><path d="M184 272 H206" stroke="#33415c" stroke-width="2"/><path d="M200 266 L208 272 L200 278" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="287" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 311 V331" stroke="#33415c" stroke-width="2"/><path d="M89 325 L95 333 L101 325" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="327" font-size="10.5" font-weight="700">OUI</text><rect data-step="4" x="6" y="335" width="178" height="99" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="353" font-size="12" font-weight="700" text-anchor="start">4. J&#x27;ai la compétence,</text><text x="14" y="368" font-size="12" font-weight="700" text-anchor="start">les pièces et</text><text x="14" y="383" font-size="12" font-weight="700" text-anchor="start">l&#x27;outillage</text><rect x="210" y="335" width="164" height="99" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="353" font-size="11.5" font-weight="400" text-anchor="start">Escalader au niveau 2,</text><text x="218" y="368" font-size="11.5" font-weight="400" text-anchor="start">au fabricant</text><text x="218" y="383" font-size="11.5" font-weight="400" text-anchor="start">(garantie) ou au</text><text x="218" y="398" font-size="11.5" font-weight="400" text-anchor="start">prestataire (copieur,</text><text x="218" y="413" font-size="11.5" font-weight="400" text-anchor="start">Internet).</text><path d="M184 384 H206" stroke="#33415c" stroke-width="2"/><path d="M200 378 L208 384 L200 390" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="399" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 436 V456" stroke="#33415c" stroke-width="2"/><path d="M89 450 L95 458 L101 450" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="452" font-size="10.5" font-weight="700">OUI</text><rect data-step="5" x="6" y="460" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="478" font-size="12" font-weight="700" text-anchor="start">5. Durée et coût</text><text x="14" y="493" font-size="12" font-weight="700" text-anchor="start">restent dans</text><text x="14" y="508" font-size="12" font-weight="700" text-anchor="start">l&#x27;estimation</text><text x="14" y="523" font-size="12" font-weight="700" text-anchor="start">acceptée</text><rect x="210" y="460" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="478" font-size="11.5" font-weight="400" text-anchor="start">④</text><path d="M184 504 H206" stroke="#33415c" stroke-width="2"/><path d="M200 498 L208 504 L200 510" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="519" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 550 V570" stroke="#33415c" stroke-width="2"/><path d="M89 564 L95 572 L101 564" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="566" font-size="10.5" font-weight="700">OUI</text><rect x="6" y="574" width="368" height="46" rx="8" fill="#e9f5ec" stroke="#2e6b3a" stroke-width="1.5"/><text x="14" y="592" font-size="12" font-weight="700" text-anchor="start">Intervenir selon le plan d&#x27;action accepté, puis</text><text x="14" y="608" font-size="12" font-weight="700" text-anchor="start">vérifier les critères de réussite.</text></svg>
