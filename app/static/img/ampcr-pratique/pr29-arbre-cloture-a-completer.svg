<svg viewBox="0 0 380 488" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Arbre de clôture à compléter</title><desc>Arbre de décision « Clôturer une intervention ». Départ : L&#x27;action est faite : peut-on rendre le poste et déclarer la demande résolue ? 1. Tous les contrôles exigés pour ce type d&#x27;intervention ont-ils été faits ? Si non : ① 2. Tous les critères mesurés sont-ils atteints ? Si non : ② 3. Tous les résultats sont-ils concluants (aucune mesure manquante) ? Si non : ③ 4. Le client a-t-il constaté le résultat et l&#x27;accepte-t-il ? Si non : ④ Si tout est oui : Faire signer la réception, remettre le rapport, archiver la fiche et la documentation.</desc><rect data-step="1" x="6" y="8" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="26" font-size="12" font-weight="700" text-anchor="start">1. Tous les contrôles</text><text x="14" y="41" font-size="12" font-weight="700" text-anchor="start">exigés pour ce type</text><text x="14" y="56" font-size="12" font-weight="700" text-anchor="start">d&#x27;intervention</text><text x="14" y="71" font-size="12" font-weight="700" text-anchor="start">ont-ils été faits ?</text><rect x="210" y="8" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="26" font-size="11.5" font-weight="400" text-anchor="start">①</text><path d="M184 52 H206" stroke="#33415c" stroke-width="2"/><path d="M200 46 L208 52 L200 58" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="67" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 98 V118" stroke="#33415c" stroke-width="2"/><path d="M89 112 L95 120 L101 112" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="114" font-size="10.5" font-weight="700">OUI</text><rect data-step="2" x="6" y="122" width="178" height="73" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="140" font-size="12" font-weight="700" text-anchor="start">2. Tous les critères</text><text x="14" y="155" font-size="12" font-weight="700" text-anchor="start">mesurés sont-ils</text><text x="14" y="170" font-size="12" font-weight="700" text-anchor="start">atteints ?</text><rect x="210" y="122" width="164" height="73" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="140" font-size="11.5" font-weight="400" text-anchor="start">②</text><path d="M184 158 H206" stroke="#33415c" stroke-width="2"/><path d="M200 152 L208 158 L200 164" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="173" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 197 V217" stroke="#33415c" stroke-width="2"/><path d="M89 211 L95 219 L101 211" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="213" font-size="10.5" font-weight="700">OUI</text><rect data-step="3" x="6" y="221" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="239" font-size="12" font-weight="700" text-anchor="start">3. Tous les résultats</text><text x="14" y="254" font-size="12" font-weight="700" text-anchor="start">sont-ils concluants</text><text x="14" y="269" font-size="12" font-weight="700" text-anchor="start">(aucune mesure</text><text x="14" y="284" font-size="12" font-weight="700" text-anchor="start">manquante) ?</text><rect x="210" y="221" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="239" font-size="11.5" font-weight="400" text-anchor="start">③</text><path d="M184 265 H206" stroke="#33415c" stroke-width="2"/><path d="M200 259 L208 265 L200 271" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="280" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 311 V331" stroke="#33415c" stroke-width="2"/><path d="M89 325 L95 333 L101 325" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="327" font-size="10.5" font-weight="700">OUI</text><rect data-step="4" x="6" y="335" width="178" height="73" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="353" font-size="12" font-weight="700" text-anchor="start">4. Le client a-t-il</text><text x="14" y="368" font-size="12" font-weight="700" text-anchor="start">constaté le résultat</text><text x="14" y="383" font-size="12" font-weight="700" text-anchor="start">et l&#x27;accepte-t-il ?</text><rect x="210" y="335" width="164" height="73" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="353" font-size="11.5" font-weight="400" text-anchor="start">④</text><path d="M184 371 H206" stroke="#33415c" stroke-width="2"/><path d="M200 365 L208 371 L200 377" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="386" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 410 V430" stroke="#33415c" stroke-width="2"/><path d="M89 424 L95 432 L101 424" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="426" font-size="10.5" font-weight="700">OUI</text><rect x="6" y="434" width="368" height="46" rx="8" fill="#e9f5ec" stroke="#2e6b3a" stroke-width="1.5"/><text x="14" y="452" font-size="12" font-weight="700" text-anchor="start">Faire signer la réception, remettre le rapport,</text><text x="14" y="468" font-size="12" font-weight="700" text-anchor="start">archiver la fiche et la documentation.</text></svg>
