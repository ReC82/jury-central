<svg viewBox="0 0 380 338" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Chaîne d&#x27;un lien à compléter</title><desc>Du haut vers le bas : switch, port 7 ; ① élément de 2 m ; ② élément portant le repère B1-P1-07 dans la baie ; câble monobrin Cat6A de 84 m ; ③ élément au mur portant le repère B1-P1-07 ; ④ élément de 5 m ; PC de la comptable. Une accolade ⑤ couvre la partie fixe, de ② à ③ ; une accolade « canal » couvre l&#x27;ensemble, du switch au PC.</desc><rect data-element="switch" x="70" y="8" width="250" height="30" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="195" y="27" font-size="11" font-weight="700" text-anchor="middle">Switch (port 7)</text><path d="M195 38 V50" stroke="#33415c" stroke-width="2"/><rect data-element="" x="70" y="50" width="250" height="30" rx="6" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="195" y="69" font-size="11" font-weight="700" text-anchor="middle">① ? (2 m)</text><path d="M195 80 V92" stroke="#33415c" stroke-width="2"/><rect data-element="" x="70" y="92" width="250" height="30" rx="6" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="195" y="111" font-size="11" font-weight="700" text-anchor="middle">② ? (port B1-P1-07)</text><path d="M195 122 V134" stroke="#33415c" stroke-width="2"/><rect data-element="permanent" x="70" y="134" width="250" height="30" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="195" y="153" font-size="11" font-weight="700" text-anchor="middle">Câble monobrin Cat6A, 84 m</text><path d="M195 164 V176" stroke="#33415c" stroke-width="2"/><rect data-element="" x="70" y="176" width="250" height="30" rx="6" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="195" y="195" font-size="11" font-weight="700" text-anchor="middle">③ ?</text><path d="M195 206 V218" stroke="#33415c" stroke-width="2"/><rect data-element="" x="70" y="218" width="250" height="30" rx="6" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="195" y="237" font-size="11" font-weight="700" text-anchor="middle">④ ? (5 m)</text><path d="M195 248 V260" stroke="#33415c" stroke-width="2"/><rect data-element="pc" x="70" y="260" width="250" height="30" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="195" y="279" font-size="11" font-weight="700" text-anchor="middle">PC de la comptable</text><path d="M330 92 h10 V206 h-10" fill="none" stroke="#b3261e" stroke-width="1.6"/><text x="346" y="149" font-size="11" font-weight="700" text-anchor="start">⑤ ?</text><path d="M62 8 h-10 V290 h10" fill="none" stroke="#b3261e" stroke-width="1.6"/><text x="6" y="145" font-size="10.5" font-weight="700" text-anchor="start">canal</text><text x="10" y="312" font-size="10.5" font-weight="400" text-anchor="start">⑤ : nom et longueur maximale de la partie fixe, du panneau à</text><text x="10" y="325" font-size="10.5" font-weight="400" text-anchor="start">la prise.</text></svg>
