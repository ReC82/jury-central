<svg viewBox="0 0 400 224" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Matrice de priorité à compléter</title><desc>Matrice de priorité, lignes = impact, colonnes = urgence. impact élevé — urgence élevée : P1 critique, urgence moyenne : ①, urgence faible : P3 normale ; impact moyen — urgence élevée : P2 haute, urgence moyenne : ②, urgence faible : ④ ; impact faible — urgence élevée : ③, urgence moyenne : P4 basse, urgence faible : P4 basse.</desc><text x="256" y="14" font-size="11.5" font-weight="700" text-anchor="middle">URGENCE →</text><text x="8" y="216" font-size="11.5" font-weight="700" text-anchor="start">↑ IMPACT (lignes)</text><rect x="6" y="20" width="112" height="26" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="62" y="37" font-size="11" font-weight="700" text-anchor="middle">Impact \ urgence</text><rect x="118" y="20" width="92" height="26" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="164" y="37" font-size="12" font-weight="700" text-anchor="middle">Élevée</text><rect x="210" y="20" width="92" height="26" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="256" y="37" font-size="12" font-weight="700" text-anchor="middle">Moyenne</text><rect x="302" y="20" width="92" height="26" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="348" y="37" font-size="12" font-weight="700" text-anchor="middle">Faible</text><rect x="6" y="46" width="112" height="48" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="62" y="74" font-size="12" font-weight="700" text-anchor="middle">Élevé</text><rect data-cell="1-1" x="118" y="46" width="92" height="48" fill="#fbecec" stroke="#33415c" stroke-width="1.5"/><text x="164" y="67" font-size="12" font-weight="700" text-anchor="middle">P1</text><text x="164" y="81" font-size="12" font-weight="700" text-anchor="middle">critique</text><rect data-cell="1-2" x="210" y="46" width="92" height="48" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="256" y="74" font-size="16" font-weight="700" text-anchor="middle">①</text><rect data-cell="1-3" x="302" y="46" width="92" height="48" fill="#e8f0fb" stroke="#33415c" stroke-width="1.5"/><text x="348" y="67" font-size="12" font-weight="700" text-anchor="middle">P3</text><text x="348" y="81" font-size="12" font-weight="700" text-anchor="middle">normale</text><rect x="6" y="94" width="112" height="48" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="62" y="122" font-size="12" font-weight="700" text-anchor="middle">Moyen</text><rect data-cell="2-1" x="118" y="94" width="92" height="48" fill="#fff3c4" stroke="#33415c" stroke-width="1.5"/><text x="164" y="115" font-size="12" font-weight="700" text-anchor="middle">P2</text><text x="164" y="129" font-size="12" font-weight="700" text-anchor="middle">haute</text><rect data-cell="2-2" x="210" y="94" width="92" height="48" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="256" y="122" font-size="16" font-weight="700" text-anchor="middle">②</text><rect data-cell="2-3" x="302" y="94" width="92" height="48" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="348" y="122" font-size="16" font-weight="700" text-anchor="middle">④</text><rect x="6" y="142" width="112" height="48" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="62" y="170" font-size="12" font-weight="700" text-anchor="middle">Faible</text><rect data-cell="3-1" x="118" y="142" width="92" height="48" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="164" y="170" font-size="16" font-weight="700" text-anchor="middle">③</text><rect data-cell="3-2" x="210" y="142" width="92" height="48" fill="#e9f5ec" stroke="#33415c" stroke-width="1.5"/><text x="256" y="163" font-size="12" font-weight="700" text-anchor="middle">P4</text><text x="256" y="177" font-size="12" font-weight="700" text-anchor="middle">basse</text><rect data-cell="3-3" x="302" y="142" width="92" height="48" fill="#e9f5ec" stroke="#33415c" stroke-width="1.5"/><text x="348" y="163" font-size="12" font-weight="700" text-anchor="middle">P4</text><text x="348" y="177" font-size="12" font-weight="700" text-anchor="middle">basse</text></svg>
