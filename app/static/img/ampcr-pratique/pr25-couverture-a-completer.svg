<svg viewBox="0 0 380 447" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Couverture à compléter</title><desc>Plan schématique de l&#x27;atelier : AP-01 dans l&#x27;atelier ; mur de briques vers le bureau et la salle de réunion, séparés par une cloison ; mur en béton vers le stock aux rayonnages métalliques ; étage au-dessus de l&#x27;atelier. Signal estimé (20 dBm rayonnés, espace libre et obstacles) : P1 Atelier, 6 m, obstacles aucun : 2,4 GHz -36 dBm (excellent), 5 GHz -42 dBm (excellent) ; P2 Bureau, 10 m, obstacles brique : 2,4 GHz -46 dBm (excellent), 5 GHz -57 dBm (excellent) ; P3 Salle de réunion, 14 m, obstacles brique + cloison : 2,4 GHz ① à compléter, 5 GHz ② à compléter ; P4 Stock, 18 m, obstacles béton + métal : 2,4 GHz ③ à compléter, 5 GHz -95 dBm (insuffisant) ; P5 Étage (au-dessus de l&#x27;atelier), 8 m, obstacles dalle : 2,4 GHz -53 dBm (excellent), 5 GHz ④ à compléter. Objectif : -67 dBm ou mieux.</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Couverture de AP-01 : mesures estimées</text><rect x="4" y="56" width="372" height="140" fill="#ffffff" stroke="#33415c" stroke-width="2.5"/><rect x="4" y="22" width="176" height="30" fill="#f4f6fb" stroke="#33415c" stroke-width="1.2" stroke-dasharray="4 2"/><text x="150" y="41" font-size="9.5" font-weight="400" text-anchor="middle">étage</text><path data-wall="brique" d="M180 56 L180 196" stroke="#33415c" stroke-width="3"/><path data-wall="cloison" d="M180 126 L300 126" stroke="#33415c" stroke-width="3"/><path data-wall="béton" d="M300 56 L300 196" stroke="#33415c" stroke-width="3"/><text x="14" y="72" font-size="10" font-weight="700" text-anchor="start">Atelier</text><text x="188" y="72" font-size="10" font-weight="700" text-anchor="start">Bureau</text><text x="188" y="190" font-size="10" font-weight="700" text-anchor="start">Réunion</text><text x="308" y="72" font-size="10" font-weight="700" text-anchor="start">Stock</text><text x="308" y="86" font-size="9" font-weight="400" text-anchor="start">rayonnages</text><text x="308" y="98" font-size="9" font-weight="400" text-anchor="start">métalliques</text><circle data-ap="AP-01" cx="60" cy="128" r="9" fill="#33415c"/><text x="60" y="152" font-size="10" font-weight="700" text-anchor="middle">AP-01</text><circle cx="92" cy="128" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="92" y="132" font-size="9.5" font-weight="700" text-anchor="middle">P1</text><circle cx="252" cy="70" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="252" y="74" font-size="9.5" font-weight="700" text-anchor="middle">P2</text><circle cx="252" cy="168" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="252" y="172" font-size="9.5" font-weight="700" text-anchor="middle">P3</text><circle cx="340" cy="128" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="340" y="132" font-size="9.5" font-weight="700" text-anchor="middle">P4</text><circle cx="92" cy="34" r="10" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="92" y="38" font-size="9.5" font-weight="700" text-anchor="middle">P5</text><text x="6" y="214" font-size="10" font-weight="700" text-anchor="start">Point</text><text x="44" y="214" font-size="10" font-weight="700" text-anchor="start">Distance, obstacles</text><text x="236" y="214" font-size="10" font-weight="700" text-anchor="start">2,4 GHz</text><text x="310" y="214" font-size="10" font-weight="700" text-anchor="start">5 GHz</text><rect data-point="P1" data-24="-36" data-5="-42" x="4" y="220" width="372" height="30" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="233" font-size="10" font-weight="700" text-anchor="start">P1</text><text x="44" y="233" font-size="9.5" font-weight="400" text-anchor="start">6 m, aucun</text><text x="44" y="245" font-size="9" font-weight="400" text-anchor="start">Atelier</text><text x="236" y="233" font-size="10" font-weight="700" text-anchor="start">-36 dBm</text><text x="236" y="245" font-size="9" font-weight="400" text-anchor="start">excellent</text><text x="310" y="233" font-size="10" font-weight="700" text-anchor="start">-42 dBm</text><text x="310" y="245" font-size="9" font-weight="400" text-anchor="start">excellent</text><rect data-point="P2" data-24="-46" data-5="-57" x="4" y="254" width="372" height="30" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="267" font-size="10" font-weight="700" text-anchor="start">P2</text><text x="44" y="267" font-size="9.5" font-weight="400" text-anchor="start">10 m, brique</text><text x="44" y="279" font-size="9" font-weight="400" text-anchor="start">Bureau</text><text x="236" y="267" font-size="10" font-weight="700" text-anchor="start">-46 dBm</text><text x="236" y="279" font-size="9" font-weight="400" text-anchor="start">excellent</text><text x="310" y="267" font-size="10" font-weight="700" text-anchor="start">-57 dBm</text><text x="310" y="279" font-size="9" font-weight="400" text-anchor="start">excellent</text><rect data-point="P3" data-24="-52" data-5="-64" x="4" y="288" width="372" height="30" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="301" font-size="10" font-weight="700" text-anchor="start">P3</text><text x="44" y="301" font-size="9.5" font-weight="400" text-anchor="start">14 m, brique + cloison</text><text x="44" y="313" font-size="9" font-weight="400" text-anchor="start">Salle de réunion</text><text x="236" y="301" font-size="10" font-weight="700" text-anchor="start">① ?</text><text x="236" y="313" font-size="9" font-weight="400" text-anchor="start"></text><text x="310" y="301" font-size="10" font-weight="700" text-anchor="start">② ?</text><text x="310" y="313" font-size="9" font-weight="400" text-anchor="start"></text><rect data-point="P4" data-24="-77" data-5="-95" x="4" y="322" width="372" height="30" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="335" font-size="10" font-weight="700" text-anchor="start">P4</text><text x="44" y="335" font-size="9.5" font-weight="400" text-anchor="start">18 m, béton + métal</text><text x="44" y="347" font-size="9" font-weight="400" text-anchor="start">Stock</text><text x="236" y="335" font-size="10" font-weight="700" text-anchor="start">③ ?</text><text x="236" y="347" font-size="9" font-weight="400" text-anchor="start"></text><text x="310" y="335" font-size="10" font-weight="700" text-anchor="start">-95 dBm</text><text x="310" y="347" font-size="9" font-weight="400" text-anchor="start">insuffisant</text><rect data-point="P5" data-24="-53" data-5="-70" x="4" y="356" width="372" height="30" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="369" font-size="10" font-weight="700" text-anchor="start">P5</text><text x="44" y="369" font-size="9.5" font-weight="400" text-anchor="start">8 m, dalle</text><text x="44" y="381" font-size="9" font-weight="400" text-anchor="start">Étage (au-dessus de l&#x27;atelier)</text><text x="236" y="369" font-size="10" font-weight="700" text-anchor="start">-53 dBm</text><text x="236" y="381" font-size="9" font-weight="400" text-anchor="start">excellent</text><text x="310" y="369" font-size="10" font-weight="700" text-anchor="start">④ ?</text><text x="310" y="381" font-size="9" font-weight="400" text-anchor="start"></text><text x="8" y="402" font-size="10.5" font-weight="400" text-anchor="start">Estimation simplifiée : 20 dBm rayonnés − affaiblissement en</text><text x="8" y="415" font-size="10.5" font-weight="400" text-anchor="start">espace libre − obstacles. Objectif -67 dBm ou mieux ; la</text><text x="8" y="428" font-size="10.5" font-weight="400" text-anchor="start">mesure sur place fait foi.</text></svg>
