<svg viewBox="0 0 380 478" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Adresses des trames à compléter</title><desc>PC-COMPTA (192.168.1.23, 3C-52-82-1A-2B-01) → switch → box (côté réseau local 192.168.1.1, A4-91-B1-07-3C-10 ; côté opérateur 203.0.113.45, A4-91-B1-07-3C-11) → routeur de l&#x27;opérateur (203.0.113.1, 00-1F-9E-55-20-01) → Internet → serveur www.exemple.be (198.51.100.20). Trame 1 (PC vers box) : MAC source 3C-52-82-1A-2B-01, MAC destination ①, IP source 192.168.1.23, IP destination 198.51.100.20. Trame 2 (box vers opérateur) : MAC source ②, MAC destination ③, IP source ④, IP destination ⑤.</desc><rect data-node="pc" x="60.0" y="6.0" width="260.0" height="38" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="190" y="21" font-size="10.5" font-weight="700" text-anchor="middle">PC-COMPTA</text><text x="190" y="34" font-size="10" font-weight="400" text-anchor="middle">192.168.1.23 · 3C-52-82-1A-2B-01</text><path d="M190 44 V58" stroke="#33415c" stroke-width="2"/><text x="326" y="55" font-size="10" font-weight="700" text-anchor="start">trame 1</text><rect data-node="switch" x="60.0" y="58.0" width="260.0" height="38" rx="6" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="190" y="73" font-size="10.5" font-weight="700" text-anchor="middle">Switch</text><text x="190" y="86" font-size="10" font-weight="400" text-anchor="middle">lit la MAC, ne modifie rien</text><path d="M190 96 V110" stroke="#33415c" stroke-width="2"/><rect data-node="box" x="60.0" y="110.0" width="260.0" height="51" rx="6" fill="#fff3c4" stroke="#33415c" stroke-width="1.4"/><text x="190" y="125" font-size="10.5" font-weight="700" text-anchor="middle">Box (routeur + NAT)</text><text x="190" y="138" font-size="10" font-weight="400" text-anchor="middle">LAN 192.168.1.1 · A4-91-B1-07-3C-10</text><text x="190" y="151" font-size="10" font-weight="400" text-anchor="middle">WAN 203.0.113.45 · A4-91-B1-07-3C-11</text><path d="M190 161 V175" stroke="#33415c" stroke-width="2"/><text x="326" y="172" font-size="10" font-weight="700" text-anchor="start">trame 2</text><rect data-node="isp" x="60.0" y="175.0" width="260.0" height="38" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="190" y="190" font-size="10.5" font-weight="700" text-anchor="middle">Routeur de l&#x27;opérateur</text><text x="190" y="203" font-size="10" font-weight="400" text-anchor="middle">203.0.113.1 · 00-1F-9E-55-20-01</text><path d="M190 213 V227" stroke="#33415c" stroke-width="2"/><rect data-node="internet" x="60.0" y="227.0" width="260.0" height="25" rx="6" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="190" y="242" font-size="10.5" font-weight="700" text-anchor="middle">Internet : autres routeurs</text><path d="M190 252 V266" stroke="#33415c" stroke-width="2"/><rect data-node="server" x="60.0" y="266.0" width="260.0" height="38" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="190" y="281" font-size="10.5" font-weight="700" text-anchor="middle">Serveur www.exemple.be</text><text x="190" y="294" font-size="10" font-weight="400" text-anchor="middle">198.51.100.20</text><text x="8" y="318" font-size="10.5" font-weight="700" text-anchor="start">Champ</text><text x="104" y="318" font-size="10.5" font-weight="700" text-anchor="start">Trame 1</text><text x="104" y="331" font-size="10.5" font-weight="700" text-anchor="start">PC → box</text><text x="240" y="318" font-size="10.5" font-weight="700" text-anchor="start">Trame 2</text><text x="240" y="331" font-size="10.5" font-weight="700" text-anchor="start">box → opérateur</text><rect x="6" y="339" width="368" height="20" rx="3" fill="#f4f6fb" stroke="#c4cad6"/><text x="10" y="353" font-size="10" font-weight="400" text-anchor="start">MAC source</text><text x="104" y="353" font-size="10" font-weight="700" text-anchor="start">3C-52-82-1A-2B-01</text><text x="240" y="353" font-size="10" font-weight="700" text-anchor="start">② ?</text><rect x="6" y="361" width="368" height="20" rx="3" fill="#f4f6fb" stroke="#c4cad6"/><text x="10" y="375" font-size="10" font-weight="400" text-anchor="start">MAC destination</text><text x="104" y="375" font-size="10" font-weight="700" text-anchor="start">① ?</text><text x="240" y="375" font-size="10" font-weight="700" text-anchor="start">③ ?</text><rect x="6" y="383" width="368" height="20" rx="3" fill="#f4f6fb" stroke="#c4cad6"/><text x="10" y="397" font-size="10" font-weight="400" text-anchor="start">IP source</text><text x="104" y="397" font-size="10" font-weight="700" text-anchor="start">192.168.1.23</text><text x="240" y="397" font-size="10" font-weight="700" text-anchor="start">④ ?</text><rect x="6" y="405" width="368" height="20" rx="3" fill="#f4f6fb" stroke="#c4cad6"/><text x="10" y="419" font-size="10" font-weight="400" text-anchor="start">IP destination</text><text x="104" y="419" font-size="10" font-weight="700" text-anchor="start">198.51.100.20</text><text x="240" y="419" font-size="10" font-weight="700" text-anchor="start">⑤ ?</text><text x="8" y="439" font-size="10.5" font-weight="400" text-anchor="start">Les adresses MAC changent à chaque routeur ; l&#x27;adresse IP de</text><text x="8" y="452" font-size="10.5" font-weight="400" text-anchor="start">destination reste la même ; la box remplace l&#x27;adresse IP</text><text x="8" y="465" font-size="10.5" font-weight="400" text-anchor="start">source privée par son adresse publique (NAT).</text></svg>
