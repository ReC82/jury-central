<svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Emplacement du répéteur à compléter</title><desc>Deux emplacements du répéteur à une radio, en 2,4 GHz. Répéteur dans l&#x27;annexe, près du portable : lien AP-01 vers REP-01 sur 30 m à travers béton + béton + brique, signal ① à compléter ; lien REP-01 vers le portable sur 3 m (aucun obstacle), -30 dBm ; débit utile pour le portable ② à compléter. Répéteur à mi-chemin, dans le couloir : lien AP-01 vers REP-01 sur 12 m à travers béton, signal ③ à compléter ; lien REP-01 vers le portable sur 18 m (béton), -57 dBm ; débit utile pour le portable ④ à compléter.</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Où placer le répéteur ?</text><rect data-placement="mal" data-uplink="-80" data-client="-30" x="4" y="30" width="372" height="134" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.2"/><text x="12" y="48" font-size="11.5" font-weight="700" text-anchor="start">Répéteur dans l&#x27;annexe, près du portable</text><rect x="12" y="60" width="70" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="19" y="77" font-size="11.5" font-weight="700" text-anchor="start">AP-01</text><text x="19" y="91" font-size="10" font-weight="400" text-anchor="start">câblé</text><path d="M82 80 L158 80" stroke="#33415c" stroke-width="2" stroke-dasharray="6 4" fill="none"/><rect x="158" y="60" width="76" height="42" rx="7" fill="#fff3c4" stroke="#33415c" stroke-width="1.5"/><text x="165" y="77" font-size="11.5" font-weight="700" text-anchor="start">REP-01</text><text x="165" y="91" font-size="10" font-weight="400" text-anchor="start">une radio</text><path d="M234 80 L300 80" stroke="#33415c" stroke-width="2" stroke-dasharray="6 4" fill="none"/><rect x="300" y="60" width="70" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="307" y="77" font-size="11.5" font-weight="700" text-anchor="start">Portable</text><text x="307" y="91" font-size="10" font-weight="400" text-anchor="start">client</text><text x="12" y="114" font-size="9.5" font-weight="400" text-anchor="start">Lien AP-01 → REP-01 : 30 m, béton + béton + brique</text><text x="12" y="127" font-size="10" font-weight="700" text-anchor="start">signal reçu par le répéteur : ① ?</text><text x="12" y="140" font-size="9.5" font-weight="400" text-anchor="start">Lien REP-01 → portable : 3 m, aucun obstacle, -30 dBm</text><text x="12" y="154" font-size="10.5" font-weight="700" text-anchor="start">Débit pour le portable : ② ?</text><rect data-placement="bien" data-uplink="-54" data-client="-57" x="4" y="172" width="372" height="134" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.2"/><text x="12" y="190" font-size="11.5" font-weight="700" text-anchor="start">Répéteur à mi-chemin, dans le couloir</text><rect x="12" y="202" width="70" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="19" y="219" font-size="11.5" font-weight="700" text-anchor="start">AP-01</text><text x="19" y="233" font-size="10" font-weight="400" text-anchor="start">câblé</text><path d="M82 222 L158 222" stroke="#33415c" stroke-width="2" stroke-dasharray="6 4" fill="none"/><rect x="158" y="202" width="76" height="42" rx="7" fill="#fff3c4" stroke="#33415c" stroke-width="1.5"/><text x="165" y="219" font-size="11.5" font-weight="700" text-anchor="start">REP-01</text><text x="165" y="233" font-size="10" font-weight="400" text-anchor="start">une radio</text><path d="M234 222 L300 222" stroke="#33415c" stroke-width="2" stroke-dasharray="6 4" fill="none"/><rect x="300" y="202" width="70" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="307" y="219" font-size="11.5" font-weight="700" text-anchor="start">Portable</text><text x="307" y="233" font-size="10" font-weight="400" text-anchor="start">client</text><text x="12" y="256" font-size="9.5" font-weight="400" text-anchor="start">Lien AP-01 → REP-01 : 12 m, béton</text><text x="12" y="269" font-size="10" font-weight="700" text-anchor="start">signal reçu par le répéteur : ③ ?</text><text x="12" y="282" font-size="9.5" font-weight="400" text-anchor="start">Lien REP-01 → portable : 18 m, béton, -57 dBm</text><text x="12" y="296" font-size="10.5" font-weight="700" text-anchor="start">Débit pour le portable : ④ ?</text><text x="8" y="322" font-size="10.5" font-weight="400" text-anchor="start">Le portable voit un excellent signal… du répéteur. Ce qui</text><text x="8" y="335" font-size="10.5" font-weight="400" text-anchor="start">compte d&#x27;abord, c&#x27;est le lien entre le point d&#x27;accès et le</text><text x="8" y="348" font-size="10.5" font-weight="400" text-anchor="start">répéteur : -67 dBm ou mieux. Un répéteur à une radio divise le</text><text x="8" y="361" font-size="10.5" font-weight="400" text-anchor="start">débit par deux.</text></svg>
