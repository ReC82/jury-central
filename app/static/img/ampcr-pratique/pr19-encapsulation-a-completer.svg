<svg viewBox="0 0 380 283" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Encapsulation d&#x27;une requête DNS à compléter</title><desc>Données de l&#x27;application : 40 octets (une requête DNS). Datagramme UDP : en-tête UDP de ④ octets + données = ① octets. Paquet IP : en-tête IP de 20 octets + datagramme = ② octets. Trame Ethernet : en-tête Ethernet de 14 octets + paquet + FCS de 4 octets = ③ octets.</desc><text x="8" y="18" font-size="11" font-weight="700" text-anchor="start">Données de l&#x27;application : 40 octets</text><rect data-part="data" x="186.0" y="24.0" width="130.0" height="28" rx="3" fill="#f4f6fb" stroke="#33415c" stroke-width="1.3"/><text x="251.0" y="42.0" font-size="10.5" font-weight="700" text-anchor="middle">Données 40</text><text x="8" y="76" font-size="11" font-weight="700" text-anchor="start">Datagramme UDP : ① ?</text><rect data-part="h-transport" x="126.0" y="82.0" width="60.0" height="28" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.3"/><text x="156.0" y="100.0" font-size="10.5" font-weight="700" text-anchor="middle">UDP ④ ?</text><rect data-part="data" x="186.0" y="82.0" width="130.0" height="28" rx="3" fill="#f4f6fb" stroke="#33415c" stroke-width="1.3"/><text x="251.0" y="100.0" font-size="10.5" font-weight="700" text-anchor="middle">Données</text><text x="8" y="134" font-size="11" font-weight="700" text-anchor="start">Paquet IP : ② ?</text><rect data-part="h-ip" x="66.0" y="140.0" width="60.0" height="28" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.3"/><text x="96.0" y="158.0" font-size="10.5" font-weight="700" text-anchor="middle">IP 20</text><rect data-part="h-transport" x="126.0" y="140.0" width="60.0" height="28" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.3"/><text x="156.0" y="158.0" font-size="10.5" font-weight="700" text-anchor="middle">UDP</text><rect data-part="data" x="186.0" y="140.0" width="130.0" height="28" rx="3" fill="#f4f6fb" stroke="#33415c" stroke-width="1.3"/><text x="251.0" y="158.0" font-size="10.5" font-weight="700" text-anchor="middle">Données</text><text x="8" y="192" font-size="11" font-weight="700" text-anchor="start">Trame Ethernet : ③ ?</text><rect data-part="h-eth" x="6.0" y="198.0" width="60.0" height="28" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.3"/><text x="36.0" y="216.0" font-size="10.5" font-weight="700" text-anchor="middle">Eth 14</text><rect data-part="h-ip" x="66.0" y="198.0" width="60.0" height="28" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.3"/><text x="96.0" y="216.0" font-size="10.5" font-weight="700" text-anchor="middle">IP</text><rect data-part="h-transport" x="126.0" y="198.0" width="60.0" height="28" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.3"/><text x="156.0" y="216.0" font-size="10.5" font-weight="700" text-anchor="middle">UDP</text><rect data-part="data" x="186.0" y="198.0" width="130.0" height="28" rx="3" fill="#f4f6fb" stroke="#33415c" stroke-width="1.3"/><text x="251.0" y="216.0" font-size="10.5" font-weight="700" text-anchor="middle">Données</text><rect data-part="fcs" x="316.0" y="198.0" width="58.0" height="28" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.3"/><text x="345.0" y="216.0" font-size="10.5" font-weight="700" text-anchor="middle">FCS 4</text><text x="8" y="244" font-size="10.5" font-weight="400" text-anchor="start">En-têtes sans option : IPv4 20, Ethernet 14 (MAC destination,</text><text x="8" y="257" font-size="10.5" font-weight="400" text-anchor="start">MAC source, type) + FCS 4 octets. Préambule de 8 octets non</text><text x="8" y="270" font-size="10.5" font-weight="400" text-anchor="start">compté.</text></svg>
