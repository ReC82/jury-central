<svg viewBox="0 0 380 468" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Droits Unix à compléter</title><desc>Ligne ls -ld : drwxrws---+ 2 root compta 4096 oct. 27 09:12 compta. Caractère 1 : d = dossier ; caractères 2 à 4 : rwx, propriétaire root ; caractères 5 à 7 : sens ① à compléter ; caractères 8 à 10 : sens ② à compléter ; caractère 11 : + = une ACL ajoute group:direction:r-x. Accès par Samba au partage compta (write list = @compta) : marie (groupe compta) Modification ; paul (groupe direction) ③ à compléter ; sam (groupe secretariat) ④ à compléter.</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Droits Unix de /srv/partages/compta</text><rect x="4" y="26" width="372" height="26" rx="5" fill="#111827" stroke="#33415c"/><text x="12" y="44" font-size="11" fill="#e5e7eb" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">drwxrws---+ 2 root compta 4096 oct. 27 09:12 compta</text><rect data-node="type" x="4" y="62" width="372" height="42" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="12" y="79" font-size="12" font-weight="700" text-anchor="start">Caractère 1</text><text x="12" y="94" font-size="10.5" font-weight="400" text-anchor="start">d = dossier</text><rect data-node="proprietaire" x="4" y="110" width="372" height="42" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="12" y="127" font-size="12" font-weight="700" text-anchor="start">Caractères 2 à 4</text><text x="12" y="142" font-size="10.5" font-weight="400" text-anchor="start">rwx — propriétaire root</text><rect x="4" y="158" width="372" height="42" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="175" font-size="12" font-weight="700" text-anchor="start">Caractères 5 à 7</text><text x="12" y="190" font-size="10.5" font-weight="400" text-anchor="start">① ?</text><rect x="4" y="206" width="372" height="42" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="223" font-size="12" font-weight="700" text-anchor="start">Caractères 8 à 10</text><text x="12" y="238" font-size="10.5" font-weight="400" text-anchor="start">② ?</text><rect data-node="acl" x="4" y="254" width="372" height="42" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="12" y="271" font-size="12" font-weight="700" text-anchor="start">Caractère 11</text><text x="12" y="286" font-size="10.5" font-weight="400" text-anchor="start">+ — une ACL ajoute group:direction:r-x</text><text x="8" y="308" font-size="11" font-weight="700" text-anchor="start">Accès par Samba à [compta] (write list = @compta) :</text><rect data-node="marie" x="4" y="318" width="372" height="27" rx="7" fill="#e9f5ec" stroke="#33415c" stroke-width="1.5"/><text x="12" y="335" font-size="12" font-weight="700" text-anchor="start">marie (groupe compta) → Modification</text><rect x="4" y="351" width="372" height="27" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="368" font-size="12" font-weight="700" text-anchor="start">paul (groupe direction) → ③ ?</text><rect x="4" y="384" width="372" height="27" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="401" font-size="12" font-weight="700" text-anchor="start">sam (groupe secretariat) → ④ ?</text><text x="8" y="429" font-size="10.5" font-weight="400" text-anchor="start">Le propriétaire, puis le groupe, puis les autres : la</text><text x="8" y="442" font-size="10.5" font-weight="400" text-anchor="start">première classe qui correspond s&#x27;applique. Par Samba, le</text><text x="8" y="455" font-size="10.5" font-weight="400" text-anchor="start">plus restrictif du partage et des droits Unix.</text></svg>
