<svg viewBox="0 0 380 355" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Baie 12 U à compléter</title><desc>Baie de 12 unités, du haut vers le bas : ① emplacement vide de 1 U ; passe-câbles 1 U ; ② emplacement vide de 1 U ; ③ emplacement vide de 1 U ; panneau de brassage 24 ports 1 U ; étagère de la box 2 U ; ④ emplacement vide de 1 U. Il reste 4 U libres en bas. Équipements à placer : un panneau de brassage 24 ports, un switch 24 ports PoE, un passe-câbles, un bandeau de prises électriques.</desc><text x="190" y="18" font-size="12" font-weight="700" text-anchor="middle">Baie 12 U à compléter</text><rect x="40" y="24" width="312" height="300" rx="4" fill="#e9ebef" stroke="#33415c" stroke-width="2"/><text x="34" y="46" font-size="9.5" font-weight="400" text-anchor="end">U12</text><text x="34" y="70" font-size="9.5" font-weight="400" text-anchor="end">U11</text><text x="34" y="94" font-size="9.5" font-weight="400" text-anchor="end">U10</text><text x="34" y="118" font-size="9.5" font-weight="400" text-anchor="end">U9</text><text x="34" y="142" font-size="9.5" font-weight="400" text-anchor="end">U8</text><text x="34" y="166" font-size="9.5" font-weight="400" text-anchor="end">U7</text><text x="34" y="190" font-size="9.5" font-weight="400" text-anchor="end">U6</text><text x="34" y="214" font-size="9.5" font-weight="400" text-anchor="end">U5</text><text x="34" y="238" font-size="9.5" font-weight="400" text-anchor="end">U4</text><text x="34" y="262" font-size="9.5" font-weight="400" text-anchor="end">U3</text><text x="34" y="286" font-size="9.5" font-weight="400" text-anchor="end">U2</text><text x="34" y="310" font-size="9.5" font-weight="400" text-anchor="end">U1</text><rect data-item="" data-u="1" x="46" y="31" width="300" height="22" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.4" stroke-dasharray="5 3"/><text x="196" y="46" font-size="11" font-weight="700" text-anchor="middle">① ? (1 U)</text><rect data-item="Passe-câbles (guide-cordons)" data-u="1" x="46" y="55" width="300" height="22" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="196" y="70" font-size="11" font-weight="700" text-anchor="middle">Passe-câbles (guide-cordons) (1 U)</text><rect data-item="" data-u="1" x="46" y="79" width="300" height="22" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.4" stroke-dasharray="5 3"/><text x="196" y="94" font-size="11" font-weight="700" text-anchor="middle">② ? (1 U)</text><rect data-item="" data-u="1" x="46" y="103" width="300" height="22" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.4" stroke-dasharray="5 3"/><text x="196" y="118" font-size="11" font-weight="700" text-anchor="middle">③ ? (1 U)</text><rect data-item="Panneau de brassage 24 ports" data-u="1" x="46" y="127" width="300" height="22" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="196" y="142" font-size="11" font-weight="700" text-anchor="middle">Panneau de brassage 24 ports (1 U)</text><rect data-item="Étagère : box de l&#x27;opérateur" data-u="2" x="46" y="151" width="300" height="46" rx="3" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="196" y="178" font-size="11" font-weight="700" text-anchor="middle">Étagère : box de l&#x27;opérateur (2 U)</text><rect data-item="" data-u="1" x="46" y="199" width="300" height="22" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.4" stroke-dasharray="5 3"/><text x="196" y="214" font-size="11" font-weight="700" text-anchor="middle">④ ? (1 U)</text><text x="10" y="342" font-size="10.5" font-weight="400" text-anchor="start">Occupé : 8 U ; libre : 4 U (réserve). 1 U = 44,45 mm.</text></svg>
