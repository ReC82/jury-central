<svg viewBox="0 0 380 490" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Mini-réseau avec box à compléter</title><desc>La box 192.168.10.254 (passerelle, DNS, DHCP, étendue 192.168.10.100 à 192.168.10.199) est reliée à l&#x27;équipement ① ; ① relie par un câble chacun des appareils. PC-A, poste fixe qui partage le dossier : 192.168.10.1/24 fixe, passerelle ③ et DNS ④ à compléter. IMP-01, imprimante réseau : adresse ② à compléter, fixe ; passerelle et DNS à compléter comme PC-A. PC-B, PC-C, PC-D, PC-E : adresses DHCP de l&#x27;étendue (.100 à .103), passerelle et DNS reçus de la box.</desc><rect data-host="BOX" x="72" y="6" width="304" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="23" font-size="12" font-weight="700" text-anchor="start">BOX — passerelle, DNS, DHCP</text><text x="80" y="38" font-size="10.5" font-weight="400" text-anchor="start">LAN : 192.168.10.254/24 · Internet : 203.0.113.45</text><path d="M58 30 H72" stroke="#33415c" stroke-width="2"/><rect data-node="" x="4" y="6" width="54" height="442" rx="8" fill="#e7ecf7" stroke="#33415c" stroke-width="1.5"/><text x="31" y="76" font-size="11.5" font-weight="700" text-anchor="middle">① ?</text><path data-link="PC-A" d="M58 88 H72" stroke="#33415c" stroke-width="2"/><rect x="72" y="58" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="75" font-size="12" font-weight="700" text-anchor="start">PC-A — poste fixe, partage le dossier</text><text x="80" y="90" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.10.1/24 (fixe)</text><text x="80" y="105" font-size="10.5" font-weight="400" text-anchor="start">passerelle ③ ? · DNS ④ ?</text><path data-link="IMP-01" d="M58 154 H72" stroke="#33415c" stroke-width="2"/><rect x="72" y="124" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="141" font-size="12" font-weight="700" text-anchor="start">IMP-01 — imprimante réseau</text><text x="80" y="156" font-size="10.5" font-weight="400" text-anchor="start">IP ② ? (fixe)</text><text x="80" y="171" font-size="10.5" font-weight="400" text-anchor="start">passerelle et DNS : à compléter comme PC-A</text><path data-link="PC-B" d="M58 220 H72" stroke="#33415c" stroke-width="2"/><rect data-host="PC-B" x="72" y="190" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="207" font-size="12" font-weight="700" text-anchor="start">PC-B — portable du technicien</text><text x="80" y="222" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.10.100/24 (DHCP)</text><text x="80" y="237" font-size="10.5" font-weight="400" text-anchor="start">passerelle et DNS reçus de la box (DHCP)</text><path data-link="PC-C" d="M58 286 H72" stroke="#33415c" stroke-width="2"/><rect data-host="PC-C" x="72" y="256" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="273" font-size="12" font-weight="700" text-anchor="start">PC-C — poste de l&#x27;accueil</text><text x="80" y="288" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.10.101/24 (DHCP)</text><text x="80" y="303" font-size="10.5" font-weight="400" text-anchor="start">passerelle et DNS reçus de la box (DHCP)</text><path data-link="PC-D" d="M58 352 H72" stroke="#33415c" stroke-width="2"/><rect data-host="PC-D" x="72" y="322" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="339" font-size="12" font-weight="700" text-anchor="start">PC-D — poste de la comptable</text><text x="80" y="354" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.10.102/24 (DHCP)</text><text x="80" y="369" font-size="10.5" font-weight="400" text-anchor="start">passerelle et DNS reçus de la box (DHCP)</text><path data-link="PC-E" d="M58 418 H72" stroke="#33415c" stroke-width="2"/><rect data-host="PC-E" x="72" y="388" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="405" font-size="12" font-weight="700" text-anchor="start">PC-E — poste du gérant (Linux)</text><text x="80" y="420" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.10.103/24 (DHCP)</text><text x="80" y="435" font-size="10.5" font-weight="400" text-anchor="start">passerelle et DNS reçus de la box (DHCP)</text><text x="8" y="464" font-size="10.5" font-weight="400" text-anchor="start">Étendue DHCP de la box : 192.168.10.100 à 192.168.10.199 ;</text><text x="8" y="477" font-size="10.5" font-weight="400" text-anchor="start">adresses fixes hors de l&#x27;étendue.</text></svg>
