<svg viewBox="0 0 380 114" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Disque du portable avant l&#x27;installation de Linux (schéma fictif)</title><desc>Barre d&#x27;un disque SSD de 512 Go, table GPT, du début à la fin du disque : 1 ESP FAT32 100 Mo ; 2 MSR 16 Mo ; 3 Windows NTFS 300 Go ; 4 Récup. NTFS 750 Mo ; 5 Libre 175 Go. Largeurs non proportionnelles aux tailles.</desc><text x="4" y="18" font-size="12.5" font-weight="700" text-anchor="start">SSD 512 Go — table GPT, démarrage UEFI</text><rect data-partition="esp" x="4.0" y="26" width="65.6" height="62" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="36.8" y="44" font-size="11" font-weight="700" text-anchor="middle">1 ESP</text><text x="36.8" y="59" font-size="11" font-weight="400" text-anchor="middle">FAT32</text><text x="36.8" y="74" font-size="11" font-weight="400" text-anchor="middle">100 Mo</text><rect data-partition="msr" x="69.6" y="26" width="43.8" height="62" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="91.5" y="44" font-size="11" font-weight="700" text-anchor="middle">2 MSR</text><text x="91.5" y="59" font-size="11" font-weight="400" text-anchor="middle">16 Mo</text><rect data-partition="windows" x="113.4" y="26" width="109.4" height="62" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="168.1" y="44" font-size="11" font-weight="700" text-anchor="middle">3 Windows</text><text x="168.1" y="59" font-size="11" font-weight="400" text-anchor="middle">NTFS</text><text x="168.1" y="74" font-size="11" font-weight="400" text-anchor="middle">300 Go</text><rect data-partition="recovery" x="222.8" y="26" width="65.6" height="62" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="255.6" y="44" font-size="11" font-weight="700" text-anchor="middle">4 Récup.</text><text x="255.6" y="59" font-size="11" font-weight="400" text-anchor="middle">NTFS</text><text x="255.6" y="74" font-size="11" font-weight="400" text-anchor="middle">750 Mo</text><rect data-partition="free" x="288.5" y="26" width="87.5" height="62" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="332.2" y="44" font-size="11" font-weight="700" text-anchor="middle">5 Libre</text><text x="332.2" y="59" font-size="11" font-weight="400" text-anchor="middle">175 Go</text><text x="4" y="100" font-size="10">début du disque</text><text x="376" y="100" font-size="10" text-anchor="end">fin du disque</text></svg>
