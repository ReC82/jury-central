<svg viewBox="0 0 380 372" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Document 1 — Fiche RJ45 sertie par le stagiaire</title><desc>Fiche RJ45 (8P8C) vue côté contacts dorés, languette de verrouillage dessous (côté opposé, non visible), extrémité de la fiche vers le haut et câble vers le bas : broche 1 à gauche, broche 8 à droite. Ordre des fils relevé de la broche 1 à la broche 8 : broche 1 blanc/orange, broche 2 orange, broche 3 blanc/vert, broche 4 blanc/bleu, broche 5 bleu, broche 6 vert, broche 7 marron, broche 8 blanc/marron. Le schéma ne donne aucun verdict.</desc><text x="190" y="18" text-anchor="middle" font-weight="700" font-size="14">Fiche relevée (cordon du stagiaire)</text><rect x="70" y="34" width="240" height="96" rx="6" fill="#f4f6fb" stroke="#33415c" stroke-width="2"/><text x="316" y="48" font-size="10.5">extrémité</text><text x="316" y="61" font-size="10.5">de la fiche</text><rect x="77.0" y="40" width="16.0" height="16" rx="2" fill="#d4a017" stroke="#8a6d0b" stroke-width="1"/><text x="85.0" y="72" text-anchor="middle" font-size="13" font-weight="700">1</text><g data-pin="1" data-wire="blanc-orange"><rect x="76.0" y="78" width="18.0" height="100" rx="3" fill="#ffffff" stroke="#e8740c" stroke-width="1.5"/><rect x="78.0" y="82" width="14.0" height="7" fill="#e8740c"/><rect x="78.0" y="98" width="14.0" height="7" fill="#e8740c"/><rect x="78.0" y="114" width="14.0" height="7" fill="#e8740c"/><rect x="78.0" y="130" width="14.0" height="7" fill="#e8740c"/><rect x="78.0" y="146" width="14.0" height="7" fill="#e8740c"/></g><rect x="107.0" y="40" width="16.0" height="16" rx="2" fill="#d4a017" stroke="#8a6d0b" stroke-width="1"/><text x="115.0" y="72" text-anchor="middle" font-size="13" font-weight="700">2</text><g data-pin="2" data-wire="orange"><rect x="106.0" y="78" width="18.0" height="100" rx="3" fill="#e8740c" stroke="#e8740c" stroke-width="1.5"/></g><rect x="137.0" y="40" width="16.0" height="16" rx="2" fill="#d4a017" stroke="#8a6d0b" stroke-width="1"/><text x="145.0" y="72" text-anchor="middle" font-size="13" font-weight="700">3</text><g data-pin="3" data-wire="blanc-vert"><rect x="136.0" y="78" width="18.0" height="100" rx="3" fill="#ffffff" stroke="#2e8b3a" stroke-width="1.5"/><rect x="138.0" y="82" width="14.0" height="7" fill="#2e8b3a"/><rect x="138.0" y="98" width="14.0" height="7" fill="#2e8b3a"/><rect x="138.0" y="114" width="14.0" height="7" fill="#2e8b3a"/><rect x="138.0" y="130" width="14.0" height="7" fill="#2e8b3a"/><rect x="138.0" y="146" width="14.0" height="7" fill="#2e8b3a"/></g><rect x="167.0" y="40" width="16.0" height="16" rx="2" fill="#d4a017" stroke="#8a6d0b" stroke-width="1"/><text x="175.0" y="72" text-anchor="middle" font-size="13" font-weight="700">4</text><g data-pin="4" data-wire="blanc-bleu"><rect x="166.0" y="78" width="18.0" height="100" rx="3" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.5"/><rect x="168.0" y="82" width="14.0" height="7" fill="#1f5fbf"/><rect x="168.0" y="98" width="14.0" height="7" fill="#1f5fbf"/><rect x="168.0" y="114" width="14.0" height="7" fill="#1f5fbf"/><rect x="168.0" y="130" width="14.0" height="7" fill="#1f5fbf"/><rect x="168.0" y="146" width="14.0" height="7" fill="#1f5fbf"/></g><rect x="197.0" y="40" width="16.0" height="16" rx="2" fill="#d4a017" stroke="#8a6d0b" stroke-width="1"/><text x="205.0" y="72" text-anchor="middle" font-size="13" font-weight="700">5</text><g data-pin="5" data-wire="bleu"><rect x="196.0" y="78" width="18.0" height="100" rx="3" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/></g><rect x="227.0" y="40" width="16.0" height="16" rx="2" fill="#d4a017" stroke="#8a6d0b" stroke-width="1"/><text x="235.0" y="72" text-anchor="middle" font-size="13" font-weight="700">6</text><g data-pin="6" data-wire="vert"><rect x="226.0" y="78" width="18.0" height="100" rx="3" fill="#2e8b3a" stroke="#2e8b3a" stroke-width="1.5"/></g><rect x="257.0" y="40" width="16