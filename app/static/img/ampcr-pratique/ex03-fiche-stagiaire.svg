osition 3-6</text><text x="8" y="278" font-size="12" font-weight="700">4</text><text x="30" y="278" font-size="12">blanc/bleu</text><text x="150" y="278" font-size="12">paire 1 (bleu)</text><text x="372" y="278" font-size="11" text-anchor="end">position 4-5</text><text x="8" y="296" font-size="12" font-weight="700">5</text><text x="30" y="296" font-size="12">bleu</text><text x="150" y="296" font-size="12">paire 1 (bleu)</text><text x="372" y="296" font-size="11" text-anchor="end">position 4-5</text><text x="8" y="314" font-size="12" font-weight="700">6</text><text x="30" y="314" font-size="12">vert</text><text x="150" y="314" font-size="12">paire 3 (vert)</text><text x="372" y="314" font-size="11" text-anchor="end">position 3-6</text><text x="8" y="332" font-size="12" font-weight="700">7</text><text x="30" y="332" font-size="12">marron</text><text x="150" y="332" font-size="12">paire 4 (marron)</text><text x="372" y="332" font-size="11" text-anchor="end">position 7-8</text><text x="8" y="350" font-size="12" font-weight="700">8</text><text x="30" y="350" font-size="12">blanc/marron</text><text x="150" y="350" font-size="12">paire 4 (marron)</text><text x="372" y="350" font-size="11" text-anchor="end">position 7-8</text></svg>
