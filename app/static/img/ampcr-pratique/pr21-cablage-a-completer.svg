<svg viewBox="0 0 380 297" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Câble droit ou croisé : tableau à compléter</title><desc>Cinq liaisons dont le câble est à trouver : ① PC (sans Auto MDI-X) avec PC (sans Auto MDI-X) ; ② PC (sans Auto MDI-X) avec Switch (sans Auto MDI-X) ; ③ Switch (sans Auto MDI-X) avec Switch (sans Auto MDI-X) ; ④ Portable (Auto MDI-X) avec PC (sans Auto MDI-X) ; ⑤ PC (sans Auto MDI-X) avec Routeur (port routé) (sans Auto MDI-X). Rappel sous le tableau : carte réseau et port routé MDI ; switch, hub et ports LAN d&#x27;une box MDI-X.</desc><text x="190" y="16" font-size="12" font-weight="700" text-anchor="middle">Quel câble ? (à compléter)</text><text x="10" y="36" font-size="10" font-weight="700" text-anchor="start">Liaison (Auto MDI-X : oui / non)</text><text x="372" y="36" font-size="10" font-weight="700" text-anchor="end">Câble</text><rect data-row="1" data-cable="" x="4" y="46" width="372" height="36" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1" stroke-dasharray="5 3"/><text x="10" y="61" font-size="10.5" font-weight="700" text-anchor="start">PC (non)</text><text x="10" y="75" font-size="10.5" font-weight="400" text-anchor="start">↔ PC (non)</text><text x="370" y="68" font-size="10.5" font-weight="700" text-anchor="end">① ?</text><rect data-row="2" data-cable="" x="4" y="86" width="372" height="36" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1" stroke-dasharray="5 3"/><text x="10" y="101" font-size="10.5" font-weight="700" text-anchor="start">PC (non)</text><text x="10" y="115" font-size="10.5" font-weight="400" text-anchor="start">↔ Switch (non)</text><text x="370" y="108" font-size="10.5" font-weight="700" text-anchor="end">② ?</text><rect data-row="3" data-cable="" x="4" y="126" width="372" height="36" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1" stroke-dasharray="5 3"/><text x="10" y="141" font-size="10.5" font-weight="700" text-anchor="start">Switch (non)</text><text x="10" y="155" font-size="10.5" font-weight="400" text-anchor="start">↔ Switch (non)</text><text x="370" y="148" font-size="10.5" font-weight="700" text-anchor="end">③ ?</text><rect data-row="4" data-cable="" x="4" y="166" width="372" height="36" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1" stroke-dasharray="5 3"/><text x="10" y="181" font-size="10.5" font-weight="700" text-anchor="start">Portable (oui)</text><text x="10" y="195" font-size="10.5" font-weight="400" text-anchor="start">↔ PC (non)</text><text x="370" y="188" font-size="10.5" font-weight="700" text-anchor="end">④ ?</text><rect data-row="5" data-cable="" x="4" y="206" width="372" height="36" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1" stroke-dasharray="5 3"/><text x="10" y="221" font-size="10.5" font-weight="700" text-anchor="start">PC (non)</text><text x="10" y="235" font-size="10.5" font-weight="400" text-anchor="start">↔ Routeur (port routé) (non)</text><text x="370" y="228" font-size="10.5" font-weight="700" text-anchor="end">⑤ ?</text><text x="8" y="258" font-size="10.5" font-weight="400" text-anchor="start">Sans Auto MDI-X : carte réseau et port routé = MDI ; switch,</text><text x="8" y="271" font-size="10.5" font-weight="400" text-anchor="start">hub et ports LAN d&#x27;une box = MDI-X. Même type → croisé ;</text><text x="8" y="284" font-size="10.5" font-weight="400" text-anchor="start">types différents → droit. Un seul port Auto MDI-X suffit.</text></svg>
