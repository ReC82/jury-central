<svg viewBox="0 0 380 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Topologie en étoile à compléter</title><desc>Internet (opérateur) en haut, relié à ① ; ① relié à ② ; ② relié par un câble distinct à 8 postes, à l&#x27;imprimante, à l&#x27;écran de réunion et à ③, un appareil au plafond du plateau sans prise électrique. ② est aussi relié au switch du bâtiment B, à 140 m dans un autre bâtiment, par la liaison ④.</desc><rect data-node="internet" x="105.0" y="6.0" width="170.0" height="27" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="190" y="21" font-size="10.5" font-weight="700" text-anchor="middle">Internet (opérateur)</text><path d="M190 33 V52" stroke="#33415c" stroke-width="2"/><rect x="110.0" y="52.0" width="160.0" height="27" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="190" y="67" font-size="10.5" font-weight="700" text-anchor="middle">① ?</text><path d="M190 79 V100" stroke="#33415c" stroke-width="2"/><rect x="90.0" y="100.0" width="200.0" height="27" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="190" y="115" font-size="10.5" font-weight="700" text-anchor="middle">② ?</text><path data-link="postes" d="M190 127 L48 196" stroke="#33415c" stroke-width="1.6"/><rect data-node="postes" x="5.0" y="196.0" width="86.0" height="27" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="48" y="211" font-size="10.5" font-weight="700" text-anchor="middle">8 postes</text><path data-link="imprimante" d="M190 127 L140 196" stroke="#33415c" stroke-width="1.6"/><rect data-node="imprimante" x="97.0" y="196.0" width="86.0" height="40" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="140" y="211" font-size="10.5" font-weight="700" text-anchor="middle">Imprimante</text><text x="140" y="224" font-size="10.5" font-weight="700" text-anchor="middle">(P03)</text><path data-link="ecran" d="M190 127 L232 196" stroke="#33415c" stroke-width="1.6"/><rect data-node="ecran" x="189.0" y="196.0" width="86.0" height="27" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="232" y="211" font-size="10.5" font-weight="700" text-anchor="middle">Écran (P08)</text><path data-link="" d="M190 127 L324 196" stroke="#33415c" stroke-width="1.6"/><rect x="281.0" y="196.0" width="86.0" height="27" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="324" y="211" font-size="10.5" font-weight="700" text-anchor="middle">③ ?</text><path data-link="" d="M290 114 H374 V286 H370" fill="none" stroke="#b3261e" stroke-width="2.4" stroke-dasharray="7 4"/><text x="368" y="160" font-size="11" font-weight="700" text-anchor="end">④ ?</text><rect data-node="switch2" x="226.0" y="272.0" width="140.0" height="27" rx="6" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="296" y="287" font-size="10.5" font-weight="700" text-anchor="middle">Switch du bâtiment B</text><text x="10" y="324" font-size="10.5" font-weight="400" text-anchor="start">Chaque prise a son propre câble jusqu&#x27;au panneau, brassé sur</text><text x="10" y="337" font-size="10.5" font-weight="400" text-anchor="start">un port du switch : un câble coupé n&#x27;arrête qu&#x27;un poste.</text></svg>
