<svg viewBox="0 0 380 219" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Carte des adresses à compléter</title><desc>Bande des adresses du réseau 192.168.10.0/24, de gauche à droite : .1 à .19 : usage ① à compléter ; .20 à .49 : usage ② à compléter ; .50 à .99 : libre (réserve) ; .100 à .199 : usage ③ à compléter ; .200 à .253 : libre (réserve) ; .254 : usage ④ à compléter.</desc><text x="190" y="16" font-size="12" font-weight="700" text-anchor="middle">Carte des adresses du réseau 192.168.10.0/24</text><rect data-range="1-19" data-use="" x="10.0" y="34" width="26.9" height="26" fill="#ffffff" stroke="#33415c" stroke-width="1"/><rect data-range="20-49" data-use="" x="36.9" y="34" width="42.5" height="26" fill="#ffffff" stroke="#33415c" stroke-width="1"/><rect data-range="50-99" data-use="Libre (réserve)" x="79.4" y="34" width="70.9" height="26" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><rect data-range="100-199" data-use="" x="150.3" y="34" width="141.7" height="26" fill="#ffffff" stroke="#33415c" stroke-width="1"/><rect data-range="200-253" data-use="Libre (réserve)" x="292.0" y="34" width="76.5" height="26" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><rect data-range="254-254" data-use="" x="368.6" y="34" width="6.0" height="26" fill="#ffffff" stroke="#33415c" stroke-width="1"/><text x="14" y="78" font-size="11" font-weight="700" text-anchor="start">.1 à .19 : ① ?</text><text x="14" y="94" font-size="11" font-weight="700" text-anchor="start">.20 à .49 : ② ?</text><text x="14" y="110" font-size="11" font-weight="400" text-anchor="start">.50 à .99 : Libre (réserve)</text><text x="14" y="126" font-size="11" font-weight="700" text-anchor="start">.100 à .199 : ③ ?</text><text x="14" y="142" font-size="11" font-weight="400" text-anchor="start">.200 à .253 : Libre (réserve)</text><text x="14" y="158" font-size="11" font-weight="700" text-anchor="start">.254 : ④ ?</text><text x="8" y="180" font-size="10.5" font-weight="400" text-anchor="start">Bandes de gauche à droite dans l&#x27;ordre des adresses ;</text><text x="8" y="193" font-size="10.5" font-weight="400" text-anchor="start">largeur proportionnelle au nombre d&#x27;adresses. .0 = adresse</text><text x="8" y="206" font-size="10.5" font-weight="400" text-anchor="start">du réseau, .255 = diffusion : jamais attribuées.</text></svg>
