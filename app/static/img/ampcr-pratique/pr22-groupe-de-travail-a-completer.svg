<svg viewBox="0 0 380 249" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Groupe de travail : comptes à compléter</title><desc>Groupe de travail WORKGROUP, sans serveur : quatre postes reliés par un switch. Chaque poste a sa propre liste de comptes locaux. PC-1 (partage le dossier Commun) : liste ① à compléter ; PC-2 : liste ② à compléter ; PC-3 : comptes locaux sara ; PC-4 : comptes locaux marc. Marc travaille sur PC-4 et PC-2 ; tout le monde (anne, paul, sara, marc) ouvre le partage de PC-1.</desc><text x="190" y="16" font-size="12" font-weight="700" text-anchor="middle">Groupe de travail WORKGROUP — pas de serveur</text><rect x="6" y="30" width="180" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="14" y="47" font-size="12" font-weight="700" text-anchor="start">PC-1 (partage Commun)</text><text x="14" y="62" font-size="10.5" font-weight="400" text-anchor="start">Comptes locaux :</text><text x="14" y="77" font-size="10.5" font-weight="400" text-anchor="start">① ?</text><rect x="194" y="30" width="180" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="202" y="47" font-size="12" font-weight="700" text-anchor="start">PC-2</text><text x="202" y="62" font-size="10.5" font-weight="400" text-anchor="start">Comptes locaux :</text><text x="202" y="77" font-size="10.5" font-weight="400" text-anchor="start">② ?</text><rect data-node="PC-3" x="6" y="131" width="180" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="14" y="148" font-size="12" font-weight="700" text-anchor="start">PC-3</text><text x="14" y="163" font-size="10.5" font-weight="400" text-anchor="start">Comptes locaux :</text><text x="14" y="178" font-size="10.5" font-weight="400" text-anchor="start">• sara</text><rect data-node="PC-4" x="194" y="131" width="180" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="202" y="148" font-size="12" font-weight="700" text-anchor="start">PC-4</text><text x="202" y="163" font-size="10.5" font-weight="400" text-anchor="start">Comptes locaux :</text><text x="202" y="178" font-size="10.5" font-weight="400" text-anchor="start">• marc</text><rect data-node="switch" x="150" y="101" width="80" height="22" rx="5" fill="#e7ecf7" stroke="#33415c" stroke-width="1.5"/><text x="190" y="116" font-size="11" font-weight="700" text-anchor="middle">Switch</text><text x="8" y="210" font-size="10.5" font-weight="400" text-anchor="start">Chaque poste vérifie lui-même ses comptes : pour ouvrir une</text><text x="8" y="223" font-size="10.5" font-weight="400" text-anchor="start">session sur un poste ou ouvrir son partage, il faut un</text><text x="8" y="236" font-size="10.5" font-weight="400" text-anchor="start">compte (avec mot de passe) sur CE poste.</text></svg>
