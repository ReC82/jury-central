<svg viewBox="0 0 380 303" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Modèles OSI et TCP/IP à compléter</title><desc>Colonne OSI, de haut en bas : 7 Application (données) ; 6 ① (données) ; 5 Session (données) ; 4 ② (segment) ; 3 ③ (unité ⑥) ; 2 ④ (unité ⑦) ; 1 Physique (bit). Colonne TCP/IP : Application en face des couches 7, 6 et 5 ; Transport en face de 4 (TCP, UDP) ; ⑤ en face de 3 (IP, ICMP) ; Accès réseau en face de 2 et 1 (Ethernet, Wi-Fi).</desc><text x="8" y="16" font-size="11.5" font-weight="700" text-anchor="start">Modèle OSI</text><text x="160" y="16" font-size="11.5" font-weight="700" text-anchor="start">Unité</text><text x="262" y="16" font-size="11.5" font-weight="700" text-anchor="start">Modèle TCP/IP</text><text x="8" y="31" font-size="9.5" font-weight="400" text-anchor="start">(n° et nom de la couche)</text><rect data-layer="7" data-name="Application" x="6" y="40" width="244" height="27" rx="4" fill="#dbe4f3" stroke="#33415c" stroke-width="1.2"/><text x="16" y="58" font-size="11.5" font-weight="700" text-anchor="start">7</text><text x="32" y="58" font-size="11" font-weight="700" text-anchor="start">Application</text><text x="160" y="58" font-size="10.5" font-weight="400" text-anchor="start">données</text><rect data-layer="6" data-name="" x="6" y="70" width="244" height="27" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1.2"/><text x="16" y="88" font-size="11.5" font-weight="700" text-anchor="start">6</text><text x="32" y="88" font-size="11" font-weight="700" text-anchor="start">① ?</text><text x="160" y="88" font-size="10.5" font-weight="400" text-anchor="start">données</text><rect data-layer="5" data-name="Session" x="6" y="100" width="244" height="27" rx="4" fill="#dbe4f3" stroke="#33415c" stroke-width="1.2"/><text x="16" y="118" font-size="11.5" font-weight="700" text-anchor="start">5</text><text x="32" y="118" font-size="11" font-weight="700" text-anchor="start">Session</text><text x="160" y="118" font-size="10.5" font-weight="400" text-anchor="start">données</text><rect data-layer="4" data-name="" x="6" y="130" width="244" height="27" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1.2"/><text x="16" y="148" font-size="11.5" font-weight="700" text-anchor="start">4</text><text x="32" y="148" font-size="11" font-weight="700" text-anchor="start">② ?</text><text x="160" y="148" font-size="10.5" font-weight="400" text-anchor="start">segment</text><rect data-layer="3" data-name="" x="6" y="160" width="244" height="27" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1.2"/><text x="16" y="178" font-size="11.5" font-weight="700" text-anchor="start">3</text><text x="32" y="178" font-size="11" font-weight="700" text-anchor="start">③ ?</text><text x="160" y="178" font-size="10.5" font-weight="400" text-anchor="start">⑥ ?</text><rect data-layer="2" data-name="" x="6" y="190" width="244" height="27" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1.2"/><text x="16" y="208" font-size="11.5" font-weight="700" text-anchor="start">2</text><text x="32" y="208" font-size="11" font-weight="700" text-anchor="start">④ ?</text><text x="160" y="208" font-size="10.5" font-weight="400" text-anchor="start">⑦ ?</text><rect data-layer="1" data-name="Physique" x="6" y="220" width="244" height="27" rx="4" fill="#dbe4f3" stroke="#33415c" stroke-width="1.2"/><text x="16" y="238" font-size="11.5" font-weight="700" text-anchor="start">1</text><text x="32" y="238" font-size="11" font-weight="700" text-anchor="start">Physique</text><text x="160" y="238" font-size="10.5" font-weight="400" text-anchor="start">bit</text><rect data-tcpip="Application" x="258" y="40" width="116" height="87" rx="4" fill="#fff3c4" stroke="#33415c" stroke-width="1.2"/><text x="316" y="72" font-size="10.5" font-weight="700" text-anchor="middle">Application</text><text x="316" y="86" font-size="9.5" font-weight="400" text-anchor="middle">HTTP, DNS, DHCP,</text><text x="316" y="98" font-size="9.5" font-weight="400" text-anchor="middle">SMTP, SMB</text><rect data-tcpip="Transport" x="258" y="130" width="116" height="27" rx="4" fill="#fff3c4" stroke="#33415c" stroke-width="1.2"/><text x="316" y="142" font-size="10.5" font-weight="700" text-anchor="middle">Transport</text><text x="316" y="154" font-size="9" font-weight="400" text-anchor="middle">TCP, UDP</text><rect data-tcpip="" x="258" y="160" width="116" height="27" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1.2"/><text x="316" y="172" font-size="10.5" font-weight="700" text-anchor="middle">⑤ ?</text><text x="316" y="184" font-size="9" font-weight="400" text-anchor="middle">IP, ICMP</text><rect data-tcpip="Accès réseau" x="258" y="190" width="116" height="57" rx="4" fill="#fff3c4" stroke="#33415c" stroke-width="1.2"/><text x="316" y="214" font-size="10.5" font-weight="700" text-anchor="middle">Accès réseau</text><text x="316" y="228" font-size="9.5" font-weight="400" text-anchor="middle">Ethernet, Wi-Fi</text><text x="8" y="264" font-size="10.5" font-weight="400" text-anchor="start">L&#x27;émetteur descend les couches (7 → 1) en ajoutant un en-tête</text><text x="8" y="277" font-size="10.5" font-weight="400" text-anchor="start">à chaque niveau ; le récepteur les remonte (1 → 7) en les</text><text x="8" y="290" font-size="10.5" font-weight="400" text-anchor="start">retirant.</text></svg>
