<svg viewBox="0 0 380 411" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Chemin UNC à compléter</title><desc>Chemin UNC décomposé : deux barres obliques inverses, puis le serveur (① à compléter), le nom du partage (② à compléter) et le chemin dans le partage (2026\factures.xlsx). Même ressource par l&#x27;adresse IP : ③ à compléter. Lecteur réseau : ④ à compléter associé à \\SRV-FICH\Compta.</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Lire un chemin UNC</text><rect x="4" y="26" width="372" height="28" rx="5" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="12" y="45" font-size="12.5" font-weight="700" text-anchor="start">\\① ?\② ?\2026\factures.xlsx</text><rect x="4" y="66" width="372" height="42" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="12" y="83" font-size="12" font-weight="700" text-anchor="start">\\ (deux barres obliques inverses)</text><text x="12" y="98" font-size="10.5" font-weight="400" text-anchor="start">début d&#x27;un chemin réseau Windows</text><rect x="4" y="114" width="372" height="42" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="131" font-size="12" font-weight="700" text-anchor="start">Serveur (nom ou adresse IP)</text><text x="12" y="146" font-size="10.5" font-weight="400" text-anchor="start">① ?</text><rect x="4" y="162" width="372" height="42" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="179" font-size="12" font-weight="700" text-anchor="start">Nom du partage</text><text x="12" y="194" font-size="10.5" font-weight="400" text-anchor="start">② ?</text><rect data-node="chemin" x="4" y="210" width="372" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="12" y="227" font-size="12" font-weight="700" text-anchor="start">Chemin dans le partage</text><text x="12" y="242" font-size="10.5" font-weight="400" text-anchor="start">2026\factures.xlsx</text><rect x="4" y="262" width="372" height="42" rx="7" fill="#fff3c4" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="279" font-size="12" font-weight="700" text-anchor="start">Même ressource par l&#x27;adresse IP</text><text x="12" y="294" font-size="10.5" font-weight="400" text-anchor="start">③ ?</text><rect x="4" y="310" width="372" height="42" rx="7" fill="#e9f5ec" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="327" font-size="12" font-weight="700" text-anchor="start">Lecteur réseau (net use)</text><text x="12" y="342" font-size="10.5" font-weight="400" text-anchor="start">④ ? = \\SRV-FICH\Compta</text><text x="8" y="372" font-size="10.5" font-weight="400" text-anchor="start">Si le chemin par l&#x27;adresse IP fonctionne et pas celui par le</text><text x="8" y="385" font-size="10.5" font-weight="400" text-anchor="start">nom, la panne est la résolution du nom (DNS), pas le partage</text><text x="8" y="398" font-size="10.5" font-weight="400" text-anchor="start">ni les droits.</text></svg>
