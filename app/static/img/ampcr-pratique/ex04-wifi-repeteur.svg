<svg viewBox="0 0 380 395" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Dossier C, document C3 — Plan du rez-de-chaussée et mesures du répéteur (schéma fictif)</title><desc>Plan simplifié, non à l&#x27;échelle : accueil avec le point d&#x27;accès, mur de briques, couloir, mur en béton, salle de dessin du fond avec le portable ; au fond de la salle, derrière une cloison, le local d&#x27;archives où se trouve le répéteur actuel R1 ; position envisagée R2 dans le couloir. Signaux mesurés en 2,4 GHz : Point d&#x27;accès → R1 (emplacement actuel, local d&#x27;archives) -71 dBm ; R1 → portable de la salle de dessin -35 dBm ; Point d&#x27;accès → portable, répéteur débranché -68 dBm ; Point d&#x27;accès → couloir (emplacement envisagé) -48 dBm ; Couloir → portable de la salle de dessin -55 dBm. Distances : point d&#x27;accès → R1 32 m ; point d&#x27;accès → R2 12 m ; R2 → portable 14 m ; point d&#x27;accès → portable 30 m. Le schéma ne donne aucune appréciation du signal.</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Atelier Linéa : plan simplifié du rez-de-chaussée</text><rect x="4" y="28" width="372" height="150" fill="#ffffff" stroke="#33415c" stroke-width="2.5"/><path data-wall="brique" d="M124 28 V178" stroke="#33415c" stroke-width="4"/><path data-wall="béton" d="M250 28 V178" stroke="#33415c" stroke-width="7"/><text x="14" y="46" font-size="10" font-weight="700" text-anchor="start">Accueil</text><text x="134" y="46" font-size="10" font-weight="700" text-anchor="start">Couloir</text><text x="256" y="140" font-size="10" font-weight="700" text-anchor="start">Salle de</text><text x="256" y="153" font-size="10" font-weight="700" text-anchor="start">dessin</text><text x="126" y="172" font-size="9" font-weight="400" text-anchor="start">brique</text><text x="254" y="172" font-size="9" font-weight="400" text-anchor="start">béton</text><path data-wall="cloison" d="M286 28 V96 H376" stroke="#33415c" stroke-width="2" fill="none"/><text x="292" y="46" font-size="9.5" font-weight="700" text-anchor="start">Archives</text><text x="300" y="110" font-size="9" font-weight="400" text-anchor="start">cloison</text><circle data-ap="AP" cx="40" cy="104" r="9" fill="#33415c"/><text x="40" y="128" font-size="9.5" font-weight="700" text-anchor="middle">Point d&#x27;accès</text><rect data-rep="milieu" x="176" y="94" width="20" height="20" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.6" stroke-dasharray="4 2"/><text x="186" y="128" font-size="9.5" font-weight="400" text-anchor="middle">R2 (envisagé)</text><rect data-rep="fond" x="330" y="56" width="20" height="20" rx="3" fill="#33415c"/><text x="340" y="90" font-size="9.5" font-weight="400" text-anchor="middle">R1 (actuel)</text><rect data-client="portable" x="320" y="132" width="26" height="16" rx="2" fill="#dbe4f3" stroke="#33415c" stroke-width="1.2"/><text x="333" y="162" font-size="9.5" font-weight="400" text-anchor="middle">portable</text><text x="8" y="198" font-size="10.5" font-weight="700" text-anchor="start">Signaux mesurés (2,4 GHz)</text><rect x="4" y="206" width="372" height="34" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="220" font-size="10" font-weight="400" text-anchor="start">Point d&#x27;accès → R1 (emplacement actuel, local</text><text x="10" y="233" font-size="10" font-weight="400" text-anchor="start">d&#x27;archives)</text><text x="370" y="220" font-size="10.5" font-weight="700" text-anchor="end">-71 dBm</text><rect x="4" y="244" width="372" height="21" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="258" font-size="10" font-weight="400" text-anchor="start">R1 → portable de la salle de dessin</text><text x="370" y="258" font-size="10.5" font-weight="700" text-anchor="end">-35 dBm</text><rect x="4" y="269" width="372" height="21" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="283" font-size="10" font-weight="400" text-anchor="start">Point d&#x27;accès → portable, répéteur débranché</text><text x="370" y="283" font-size="10.5" font-weight="700" text-anchor="end">-68 dBm</text><rect x="4" y="294" width="372" height="21" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="308" font-size="10" font-weight="400" text-anchor="start">Point d&#x27;accès → couloir (emplacement envisagé)</text><text x="370" y="308" font-size="10.5" font-weight="700" text-anchor="end">-48 dBm</text><rect x="4" y="319" width="372" height="21" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="0.8"/><text x="10" y="333" font-size="10" font-weight="400" text-anchor="start">Couloir → portable de la salle de dessin</text><text x="370" y="333" font-size="10.5" font-weight="700" text-anchor="end">-55 dBm</text><text x="8" y="356" font-size="10" font-weight="400" text-anchor="start">Distances :</text><text x="8" y="369" font-size="10" font-weight="400" text-anchor="start">point d&#x27;accès → R1 32 m ; point d&#x27;accès → R2 12 m ;</text><text x="8" y="382" font-size="10" font-weight="400" text-anchor="start">R2 → portable 14 m ; point d&#x27;accès → portable 30 m.</text></svg>
