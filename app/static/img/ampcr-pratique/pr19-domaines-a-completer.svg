<svg viewBox="0 0 380 239" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Domaines à compter</title><desc>Un routeur R1 a deux interfaces. La première est reliée à un switch SW1, qui relie quatre postes PC1 à PC4. La seconde est reliée à un hub, qui relie trois postes PC5 à PC7.</desc><path data-link="R1-SW1" data-collision="" d="M190 34 L95 104" stroke="#33415c" stroke-width="1.6"/><path data-link="R1-HUB" data-collision="" d="M190 34 L300 104" stroke="#33415c" stroke-width="1.6"/><path data-link="SW1-PC1" data-collision="" d="M95 104 L25 178" stroke="#33415c" stroke-width="1.6"/><path data-link="SW1-PC2" data-collision="" d="M95 104 L72 178" stroke="#33415c" stroke-width="1.6"/><path data-link="SW1-PC3" data-collision="" d="M95 104 L119 178" stroke="#33415c" stroke-width="1.6"/><path data-link="SW1-PC4" data-collision="" d="M95 104 L166 178" stroke="#33415c" stroke-width="1.6"/><path data-link="HUB-PC5" data-collision="" d="M300 104 L250 178" stroke="#33415c" stroke-width="1.6"/><path data-link="HUB-PC6" data-collision="" d="M300 104 L300 178" stroke="#33415c" stroke-width="1.6"/><path data-link="HUB-PC7" data-collision="" d="M300 104 L350 178" stroke="#33415c" stroke-width="1.6"/><rect data-device="R1" data-kind="routeur" x="168.0" y="23" width="44" height="22" rx="4" fill="#fff3c4" stroke="#33415c" stroke-width="1.4"/><text x="190" y="38" font-size="9.5" font-weight="700" text-anchor="middle">R1</text><rect data-device="SW1" data-kind="switch" x="73.0" y="93" width="44" height="22" rx="4" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="95" y="108" font-size="9.5" font-weight="700" text-anchor="middle">SW1</text><rect data-device="HUB" data-kind="hub" x="278.0" y="93" width="44" height="22" rx="4" fill="#f6d9d6" stroke="#33415c" stroke-width="1.4"/><text x="300" y="108" font-size="9.5" font-weight="700" text-anchor="middle">HUB</text><rect data-device="PC1" data-kind="pc" x="7.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="25" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC1</text><rect data-device="PC2" data-kind="pc" x="54.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="72" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC2</text><rect data-device="PC3" data-kind="pc" x="101.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="119" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC3</text><rect data-device="PC4" data-kind="pc" x="148.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="166" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC4</text><rect data-device="PC5" data-kind="pc" x="232.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="250" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC5</text><rect data-device="PC6" data-kind="pc" x="282.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="300" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC6</text><rect data-device="PC7" data-kind="pc" x="332.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="350" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC7</text><text x="8" y="226" font-size="10.5" font-weight="400" text-anchor="start">R : routeur ; SW : switch ; HUB : hub ; PC : poste.</text></svg>
