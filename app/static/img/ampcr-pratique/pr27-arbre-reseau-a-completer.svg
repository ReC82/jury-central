<svg viewBox="0 0 380 614" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Arbre réseau à compléter</title><desc>Arbre de décision « Réseau — un poste n&#x27;accède pas au réseau ou à Internet ». Départ : Pas d&#x27;Internet, pas de partage, « Aucun accès réseau ». 1. Le lien est-il présent (voyant, pas « Média déconnecté ») ? Si non : ① 2. L&#x27;adresse IP est-elle valide (pas 169.254.x.x) ? Si non : ② 3. La passerelle répond-elle (ping de son adresse) ? Si non : ③ 4. Une adresse IP publique répond-elle (ping 8.8.8.8) ? Si non : Au-delà de la passerelle : box, liaison du fournisseur, pare-feu ; tracert situe l&#x27;arrêt. 5. Les noms sont-ils résolus (nslookup) ? Si non : ④ Si tout est oui : Le réseau fonctionne : chercher au niveau du service (navigateur, proxy, partage, compte, droits).</desc><rect data-step="1" x="6" y="8" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="26" font-size="12" font-weight="700" text-anchor="start">1. Le lien est-il</text><text x="14" y="41" font-size="12" font-weight="700" text-anchor="start">présent (voyant, pas</text><text x="14" y="56" font-size="12" font-weight="700" text-anchor="start">« Média déconnecté</text><text x="14" y="71" font-size="12" font-weight="700" text-anchor="start">») ?</text><rect x="210" y="8" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="26" font-size="11.5" font-weight="400" text-anchor="start">①</text><path d="M184 52 H206" stroke="#33415c" stroke-width="2"/><path d="M200 46 L208 52 L200 58" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="67" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 98 V118" stroke="#33415c" stroke-width="2"/><path d="M89 112 L95 120 L101 112" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="114" font-size="10.5" font-weight="700">OUI</text><rect data-step="2" x="6" y="122" width="178" height="73" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="140" font-size="12" font-weight="700" text-anchor="start">2. L&#x27;adresse IP</text><text x="14" y="155" font-size="12" font-weight="700" text-anchor="start">est-elle valide (pas</text><text x="14" y="170" font-size="12" font-weight="700" text-anchor="start">169.254.x.x) ?</text><rect x="210" y="122" width="164" height="73" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="140" font-size="11.5" font-weight="400" text-anchor="start">②</text><path d="M184 158 H206" stroke="#33415c" stroke-width="2"/><path d="M200 152 L208 158 L200 164" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="173" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 197 V217" stroke="#33415c" stroke-width="2"/><path d="M89 211 L95 219 L101 211" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="213" font-size="10.5" font-weight="700">OUI</text><rect data-step="3" x="6" y="221" width="178" height="73" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="239" font-size="12" font-weight="700" text-anchor="start">3. La passerelle</text><text x="14" y="254" font-size="12" font-weight="700" text-anchor="start">répond-elle (ping de</text><text x="14" y="269" font-size="12" font-weight="700" text-anchor="start">son adresse) ?</text><rect x="210" y="221" width="164" height="73" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="239" font-size="11.5" font-weight="400" text-anchor="start">③</text><path d="M184 257 H206" stroke="#33415c" stroke-width="2"/><path d="M200 251 L208 257 L200 263" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="272" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 296 V316" stroke="#33415c" stroke-width="2"/><path d="M89 310 L95 318 L101 310" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="312" font-size="10.5" font-weight="700">OUI</text><rect data-step="4" x="6" y="320" width="178" height="114" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="338" font-size="12" font-weight="700" text-anchor="start">4. Une adresse IP</text><text x="14" y="353" font-size="12" font-weight="700" text-anchor="start">publique répond-elle</text><text x="14" y="368" font-size="12" font-weight="700" text-anchor="start">(ping 8.8.8.8) ?</text><rect x="210" y="320" width="164" height="114" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="338" font-size="11.5" font-weight="400" text-anchor="start">Au-delà de la</text><text x="218" y="353" font-size="11.5" font-weight="400" text-anchor="start">passerelle : box,</text><text x="218" y="368" font-size="11.5" font-weight="400" text-anchor="start">liaison du</text><text x="218" y="383" font-size="11.5" font-weight="400" text-anchor="start">fournisseur, pare-feu</text><text x="218" y="398" font-size="11.5" font-weight="400" text-anchor="start">; tracert situe</text><text x="218" y="413" font-size="11.5" font-weight="400" text-anchor="start">l&#x27;arrêt.</text><path d="M184 377 H206" stroke="#33415c" stroke-width="2"/><path d="M200 371 L208 377 L200 383" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="392" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 436 V456" stroke="#33415c" stroke-width="2"/><path d="M89 450 L95 458 L101 450" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="452" font-size="10.5" font-weight="700">OUI</text><rect data-step="5" x="6" y="460" width="178" height="58" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="478" font-size="12" font-weight="700" text-anchor="start">5. Les noms sont-ils</text><text x="14" y="493" font-size="12" font-weight="700" text-anchor="start">résolus (nslookup) ?</text><rect x="210" y="460" width="164" height="58" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="478" font-size="11.5" font-weight="400" text-anchor="start">④</text><path d="M184 489 H206" stroke="#33415c" stroke-width="2"/><path d="M200 483 L208 489 L200 495" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="504" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 520 V540" stroke="#33415c" stroke-width="2"/><path d="M89 534 L95 542 L101 534" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="536" font-size="10.5" font-weight="700">OUI</text><rect x="6" y="544" width="368" height="62" rx="8" fill="#e9f5ec" stroke="#2e6b3a" stroke-width="1.5"/><text x="14" y="562" font-size="12" font-weight="700" text-anchor="start">Le réseau fonctionne : chercher au niveau du</text><text x="14" y="578" font-size="12" font-weight="700" text-anchor="start">service (navigateur, proxy, partage, compte,</text><text x="14" y="594" font-size="12" font-weight="700" text-anchor="start">droits).</text></svg>
