<svg viewBox="0 0 380 386" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Plan lettré d&#x27;une carte mère ATX (support fictif)</title><desc>Plan simplifié d&#x27;une carte mère ATX vue de dessus, plaque d&#x27;entrées-sorties à gauche, avec douze repères lettrés : A quatre longs emplacements parallèles munis de clips, juste à droite du repère E ; B connecteur à 8 broches dans le coin supérieur gauche, au-dessus de petits radiateurs ; C long emplacement horizontal, le plus proche du repère E, sous celui-ci ; D petit élément rond et plat d&#x27;environ 2 cm, en bas de la carte ; E grand support carré dans la moitié haute, à gauche du centre, bordé à sa gauche par de petits radiateurs ; F petits connecteurs en L regroupés sur le bord droit, dans la moitié basse ; G connecteur haut et étroit à deux rangées de broches, juste à droite du repère A ; H fente plate couchée sur la carte, juste sous le repère C, où un module se fixe par une vis ; I petit connecteur à 4 broches juste sous le repère E ; J rangée de broches fines dans le coin inférieur droit ; K puce plate sous un radiateur, en bas à droite, à gauche du repère F ; L connecteur rectangulaire à 19 broches en haut à droite, à côté du repère G. Les cadres gris sans lettre ne sont pas à identifier. Ce n&#x27;est pas un plan à l&#x27;échelle.</desc><rect x="2" y="22" width="376" height="362" rx="6" fill="#eef3ee" stroke="#2e6b3a" stroke-width="2"/><text x="190" y="15" font-size="12.5" font-weight="700" text-anchor="middle">Carte mère ATX fictive — repères A à L</text><rect data-part="io" data-letter="" x="8" y="30" width="52" height="140" rx="3" fill="#e3e7e3" stroke="#33415c" stroke-width="1.5"/><rect data-part="eps" data-letter="B" x="70" y="30" width="100" height="22" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="120" y="46" font-size="13" font-weight="700" text-anchor="middle">B</text><rect data-part="vrm" data-letter="" x="70" y="58" width="26" height="112" rx="3" fill="#e3e7e3" stroke="#33415c" stroke-width="1.5"/><rect data-part="socket" data-letter="E" x="102" y="62" width="92" height="92" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="148" y="113" font-size="13" font-weight="700" text-anchor="middle">E</text><rect data-part="cpufan" data-letter="I" x="102" y="158" width="92" height="14" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="148" y="170" font-size="11" font-weight="700" text-anchor="middle">I</text><rect data-part="ram" data-letter="A" x="204" y="30" width="76" height="142" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="242" y="106" font-size="13" font-weight="700" text-anchor="middle">A</text><rect data-part="atx24" data-letter="G" x="290" y="40" width="26" height="110" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="303" y="100" font-size="13" font-weight="700" text-anchor="middle">G</text><rect data-part="usb3" data-letter="L" x="324" y="40" width="48" height="50" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="348" y="70" font-size="13" font-weight="700" text-anchor="middle">L</text><rect data-part="pcie16" data-letter="C" x="24" y="198" width="230" height="18" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="139" y="212" font-size="13" font-weight="700" text-anchor="middle">C</text><rect data-part="m21" data-letter="H" x="24" y="226" width="150" height="16" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="99" y="239" font-size="11" font-weight="700" text-anchor="middle">H</text><rect data-part="pcie1" data-letter="" x="24" y="252" width="70" height="14" rx="3" fill="#e3e7e3" stroke="#33415c" stroke-width="1.5"/><rect data-part="pcie4" data-letter="" x="24" y="276" width="230" height="18" rx="3" fill="#e3e7e3" stroke="#33415c" stroke-width="1.5"/><rect data-part="m22" data-letter="" x="24" y="304" width="150" height="16" rx="3" fill="#e3e7e3" stroke="#33415c" stroke-width="1.5"/><rect data-part="chipset" data-letter="K" x="264" y="236" width="62" height="50" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="295" y="266" font-size="13" font-weight="700" text-anchor="middle">K</text><rect data-part="sata" data-letter="F" x="334" y="196" width="38" height="98" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="353" y="250" font-size="13" font-weight="700" text-anchor="middle">F</text><rect data-part="bios" data-letter="" x="186" y="304" width="54" height="30" rx="3" fill="#e3e7e3" stroke="#33415c" stroke-width="1.5"/><rect data-part="cmos" data-letter="D" x="250" y="302" width="42" height="42" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="271" y="328" font-size="13" font-weight="700" text-anchor="middle">D</text><rect data-part="audio" data-letter="" x="8" y="334" width="80" height="24" rx="3" fill="#e3e7e3" stroke="#33415c" stroke-width="1.5"/><rect data-part="usb2" data-letter="" x="98" y="334" width="70" height="24" rx="3" fill="#e3e7e3" stroke="#33415c" stroke-width="1.5"/><rect data-part="panel" data-letter="J" x="300" y="352" width="72" height="24" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/><text x="336" y="369" font-size="13" font-weight="700" text-anchor="middle">J</text></svg>
