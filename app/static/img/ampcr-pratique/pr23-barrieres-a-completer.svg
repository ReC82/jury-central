<svg viewBox="0 0 380 364" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Deux barrières à compléter</title><desc>Compte cdupont (groupes Utilisateurs du domaine, G_Direction) qui ouvre Compta. Barrière 1, partage Compta : Utilisateurs authentifiés Modifier ; droit du compte ① à compléter. Barrière 2, NTFS : G_Compta Modification; G_Direction Lecture et exécution ; droit du compte ② à compléter. Accès par le réseau (la plus restrictive) : ③ à compléter. Accès en session sur le serveur (NTFS seul) : ④ à compléter.</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Deux barrières : cdupont → Compta</text><rect x="4" y="28" width="372" height="42" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="12" y="45" font-size="12" font-weight="700" text-anchor="start">Compte DUPONT\cdupont</text><text x="12" y="60" font-size="10.5" font-weight="400" text-anchor="start">groupes : Utilisateurs du domaine, G_Direction</text><path d="M190 76 V82" stroke="#33415c" stroke-width="2"/><rect x="4" y="82" width="372" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="99" font-size="12" font-weight="700" text-anchor="start">1. Partage \\SRV-FICH\Compta</text><text x="12" y="114" font-size="10.5" font-weight="400" text-anchor="start">Utilisateurs authentifiés : Modifier</text><text x="12" y="129" font-size="10.5" font-weight="400" text-anchor="start">→ droit du compte : ① ?</text><path d="M190 139 V151" stroke="#33415c" stroke-width="2"/><rect x="4" y="151" width="372" height="72" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="168" font-size="12" font-weight="700" text-anchor="start">2. NTFS (onglet Sécurité) de Compta</text><text x="12" y="183" font-size="10.5" font-weight="400" text-anchor="start">G_Compta : Modification; G_Direction : Lecture et</text><text x="12" y="198" font-size="10.5" font-weight="400" text-anchor="start">exécution</text><text x="12" y="213" font-size="10.5" font-weight="400" text-anchor="start">→ droit du compte : ② ?</text><rect x="4" y="235" width="182" height="57" rx="7" fill="#e9f5ec" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="252" font-size="12" font-weight="700" text-anchor="start">Par le réseau</text><text x="12" y="267" font-size="10.5" font-weight="400" text-anchor="start">la plus restrictive :</text><text x="12" y="282" font-size="10.5" font-weight="400" text-anchor="start">③ ?</text><rect x="194" y="235" width="182" height="57" rx="7" fill="#fff3c4" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="202" y="252" font-size="12" font-weight="700" text-anchor="start">Session sur le serveur</text><text x="202" y="267" font-size="10.5" font-weight="400" text-anchor="start">NTFS seul :</text><text x="202" y="282" font-size="10.5" font-weight="400" text-anchor="start">④ ?</text><text x="8" y="312" font-size="10.5" font-weight="400" text-anchor="start">Dans chaque barrière, les droits des groupes du compte se</text><text x="8" y="325" font-size="10.5" font-weight="400" text-anchor="start">cumulent (le plus fort compte) ; un refus explicite</text><text x="8" y="338" font-size="10.5" font-weight="400" text-anchor="start">l&#x27;emporte. Entre les deux barrières, c&#x27;est le plus faible</text><text x="8" y="351" font-size="10.5" font-weight="400" text-anchor="start">qui gagne.</text></svg>
