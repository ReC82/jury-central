<svg viewBox="0 0 400 452" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Structure du rapport à compléter</title><desc>Le rapport d&#x27;intervention en six parties : 1. Identification : N° de demande, date, technicien, Équipement (identité non sensible) ; 2. Demande et symptômes : Demande, Symptômes ; 3. Analyse : ①, Relevés, Tests, Résultats ; 4. Intervention : Action réalisée, ② ; 5. Contrôles et validation : Validation, ③ ; 6. Suite et accord : Recommandation, ④.</desc><text x="200" y="18" font-size="13" font-weight="700" text-anchor="middle">Le rapport d&#x27;intervention en 6 parties</text><rect data-section="1. Identification" x="6" y="30" width="388" height="60" rx="6" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="48" font-size="12.5" font-weight="700" text-anchor="start">1. Identification</text><text x="26" y="66" font-size="11.5" font-weight="400" text-anchor="start">• N° de demande, date, technicien</text><text x="26" y="81" font-size="11.5" font-weight="400" text-anchor="start">• Équipement (identité non sensible)</text><rect data-section="2. Demande et symptômes" x="6" y="95" width="388" height="60" rx="6" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="113" font-size="12.5" font-weight="700" text-anchor="start">2. Demande et symptômes</text><text x="26" y="131" font-size="11.5" font-weight="400" text-anchor="start">• Demande</text><text x="26" y="146" font-size="11.5" font-weight="400" text-anchor="start">• Symptômes</text><rect data-section="3. Analyse" x="6" y="160" width="388" height="90" rx="6" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="178" font-size="12.5" font-weight="700" text-anchor="start">3. Analyse</text><text x="26" y="196" font-size="11.5" font-weight="400" text-anchor="start">• ①</text><text x="26" y="211" font-size="11.5" font-weight="400" text-anchor="start">• Relevés</text><text x="26" y="226" font-size="11.5" font-weight="400" text-anchor="start">• Tests</text><text x="26" y="241" font-size="11.5" font-weight="400" text-anchor="start">• Résultats</text><rect data-section="4. Intervention" x="6" y="255" width="388" height="60" rx="6" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="273" font-size="12.5" font-weight="700" text-anchor="start">4. Intervention</text><text x="26" y="291" font-size="11.5" font-weight="400" text-anchor="start">• Action réalisée</text><text x="26" y="306" font-size="11.5" font-weight="400" text-anchor="start">• ②</text><rect data-section="5. Contrôles et validation" x="6" y="320" width="388" height="60" rx="6" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="338" font-size="12.5" font-weight="700" text-anchor="start">5. Contrôles et validation</text><text x="26" y="356" font-size="11.5" font-weight="400" text-anchor="start">• Validation</text><text x="26" y="371" font-size="11.5" font-weight="400" text-anchor="start">• ③</text><rect data-section="6. Suite et accord" x="6" y="385" width="388" height="60" rx="6" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="403" font-size="12.5" font-weight="700" text-anchor="start">6. Suite et accord</text><text x="26" y="421" font-size="11.5" font-weight="400" text-anchor="start">• Recommandation</text><text x="26" y="436" font-size="11.5" font-weight="400" text-anchor="start">• ④</text></svg>
