<svg viewBox="0 0 380 373" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Canaux 2,4 GHz à compléter</title><desc>Axe des canaux 2,4 GHz de 1 (2412 MHz) à 13 (2472 MHz), 5 MHz entre deux numéros, chaque canal occupe environ 22 MHz. Canaux sans chevauchement : ① à compléter, ② à compléter, ③ à compléter. Voisins relevés : Boulangerie-Wifi canal 1 à -58 dBm; Proximus-7F3A canal 3 à -71 dBm; Cabinet-Lenoir canal 11 à -88 dBm; Livebox-21C0 canal 13 à -79 dBm. Canal conseillé pour l&#x27;atelier : ④ à compléter.</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Bande 2,4 GHz : canaux et chevauchements</text><path d="M48 150 H328" stroke="#33415c" stroke-width="1.5"/><path d="M56.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="56" y="167" font-size="10" font-weight="400" text-anchor="middle">1</text><path d="M78.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="78" y="167" font-size="10" font-weight="400" text-anchor="middle">2</text><path d="M100.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="100" y="167" font-size="10" font-weight="400" text-anchor="middle">3</text><path d="M122.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="122" y="167" font-size="10" font-weight="400" text-anchor="middle">4</text><path d="M144.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="144" y="167" font-size="10" font-weight="400" text-anchor="middle">5</text><path d="M166.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="166" y="167" font-size="10" font-weight="400" text-anchor="middle">6</text><path d="M188.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="188" y="167" font-size="10" font-weight="400" text-anchor="middle">7</text><path d="M210.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="210" y="167" font-size="10" font-weight="400" text-anchor="middle">8</text><path d="M232.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="232" y="167" font-size="10" font-weight="400" text-anchor="middle">9</text><path d="M254.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="254" y="167" font-size="10" font-weight="400" text-anchor="middle">10</text><path d="M276.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="276" y="167" font-size="10" font-weight="400" text-anchor="middle">11</text><path d="M298.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="298" y="167" font-size="10" font-weight="400" text-anchor="middle">12</text><path d="M320.0 150 V155" stroke="#33415c" stroke-width="1.2"/><text x="320" y="167" font-size="10" font-weight="400" text-anchor="middle">13</text><text x="190" y="181" font-size="9.5" font-weight="400" text-anchor="middle">canal 1 = 2412 MHz … canal 13 = 2472 MHz ; 5 MHz entre deux numéros</text><text x="56" y="52" font-size="12" font-weight="700" text-anchor="middle">① ?</text><path d="M7.6 150 Q56.0 50 104.4 150" fill="none" stroke="#33415c" stroke-width="2.5"/><text x="166" y="52" font-size="12" font-weight="700" text-anchor="middle">② ?</text><path d="M117.6 150 Q166.0 50 214.4 150" fill="none" stroke="#33415c" stroke-width="2.5"/><text x="276" y="52" font-size="12" font-weight="700" text-anchor="middle">③ ?</text><path d="M227.6 150 Q276.0 50 324.4 150" fill="none" stroke="#33415c" stroke-width="2.5"/><path data-neighbor="1" data-center="2412" d="M7.6 150 Q56.0 34.0 104.4 150" fill="none" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><path data-neighbor="3" data-center="2422" d="M51.6 150 Q100.0 58.0 148.4 150" fill="none" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><path data-neighbor="11" data-center="2462" d="M227.6 150 Q276.0 82.0 324.4 150" fill="none" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><path data-neighbor="13" data-center="2472" d="M271.6 150 Q320.0 34.0 368.4 150" fill="none" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="8" y="198" font-size="10.5" font-weight="700" text-anchor="start">Voisins relevés (tirets) :</text><text x="14" y="212" font-size="10.5" font-weight="400" text-anchor="start">Boulangerie-Wifi : canal 1, -58 dBm</text><text x="14" y="225" font-size="10.5" font-weight="400" text-anchor="start">Proximus-7F3A : canal 3, -71 dBm</text><text x="14" y="238" font-size="10.5" font-weight="400" text-anchor="start">Cabinet-Lenoir : canal 11, -88 dBm</text><text x="14" y="251" font-size="10.5" font-weight="400" text-anchor="start">Livebox-21C0 : canal 13, -79 dBm</text><rect x="4" y="268" width="372" height="42" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="11" y="285" font-size="11.5" font-weight="700" text-anchor="start">Canal conseillé pour l&#x27;atelier</text><text x="11" y="299" font-size="10" font-weight="400" text-anchor="start">④ ?</text><text x="8" y="328" font-size="10.5" font-weight="400" text-anchor="start">Arcs pleins : 1, 6, 11, les seuls à ne pas se chevaucher. Un</text><text x="8" y="341" font-size="10.5" font-weight="400" text-anchor="start">voisin gêne s&#x27;il est reçu à -80 dBm ou plus sur un canal à</text><text x="8" y="354" font-size="10.5" font-weight="400" text-anchor="start">moins de 5 numéros.</text></svg>
