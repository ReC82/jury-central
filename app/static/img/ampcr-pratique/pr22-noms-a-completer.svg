<svg viewBox="0 0 380 317" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Noms du domaine à compléter</title><desc>Fiche des noms du domaine : Domaine DNS (nom complet) : ad.dupont.example ; Nom NetBIOS du domaine : ① à compléter ; Contrôleur (nom DNS complet) : dc01.ad.dupont.example ; Poste (nom DNS complet) : ② à compléter ; Connexion au domaine (NetBIOS) : ③ à compléter ; Connexion au domaine (UPN) : ④ à compléter ; Compte local du poste : .\support  ou  PC-03\support.</desc><text x="190" y="18" font-size="12.5" font-weight="700" text-anchor="middle">Les noms d&#x27;un même domaine</text><rect data-row="1" data-value="ad.dupont.example" x="4" y="30" width="372" height="30" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><text x="10" y="43" font-size="10" font-weight="700" text-anchor="start">Domaine DNS (nom complet)</text><text x="10" y="56" font-size="11" font-weight="400" text-anchor="start">ad.dupont.example</text><rect data-row="2" data-value="" x="4" y="64" width="372" height="30" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1" stroke-dasharray="5 3"/><text x="10" y="77" font-size="10" font-weight="700" text-anchor="start">Nom NetBIOS du domaine</text><text x="10" y="90" font-size="11" font-weight="400" text-anchor="start">① ?</text><rect data-row="3" data-value="dc01.ad.dupont.example" x="4" y="98" width="372" height="30" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><text x="10" y="111" font-size="10" font-weight="700" text-anchor="start">Contrôleur (nom DNS complet)</text><text x="10" y="124" font-size="11" font-weight="400" text-anchor="start">dc01.ad.dupont.example</text><rect data-row="4" data-value="" x="4" y="132" width="372" height="30" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1" stroke-dasharray="5 3"/><text x="10" y="145" font-size="10" font-weight="700" text-anchor="start">Poste (nom DNS complet)</text><text x="10" y="158" font-size="11" font-weight="400" text-anchor="start">② ?</text><rect data-row="5" data-value="" x="4" y="166" width="372" height="30" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1" stroke-dasharray="5 3"/><text x="10" y="179" font-size="10" font-weight="700" text-anchor="start">Connexion au domaine (NetBIOS)</text><text x="10" y="192" font-size="11" font-weight="400" text-anchor="start">③ ?</text><rect data-row="6" data-value="" x="4" y="200" width="372" height="30" rx="4" fill="#ffffff" stroke="#33415c" stroke-width="1" stroke-dasharray="5 3"/><text x="10" y="213" font-size="10" font-weight="700" text-anchor="start">Connexion au domaine (UPN)</text><text x="10" y="226" font-size="11" font-weight="400" text-anchor="start">④ ?</text><rect data-row="7" data-value=".\support  ou  PC-03\support" x="4" y="234" width="372" height="30" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><text x="10" y="247" font-size="10" font-weight="700" text-anchor="start">Compte local du poste</text><text x="10" y="260" font-size="11" font-weight="400" text-anchor="start">.\support  ou  PC-03\support</text><text x="8" y="278" font-size="10.5" font-weight="400" text-anchor="start">Domaine DNS : nom du domaine dans le DNS (fictif, .example).</text><text x="8" y="291" font-size="10.5" font-weight="400" text-anchor="start">NetBIOS : nom court, 15 caractères au plus. Le préfixe avant</text><text x="8" y="304" font-size="10.5" font-weight="400" text-anchor="start">« \ » dit qui vérifie le mot de passe.</text></svg>
