<svg viewBox="0 0 380 742" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Arbre de recette d&#x27;un poste à compléter</title><desc>Arbre de décision « Un poste échoue à la recette ». Départ : Un poste de la PME n&#x27;atteint pas le partage ou Internet au moment de la recette. Question 1 : Le voyant de la carte et du port du switch sont-ils allumés ? Si non : ① Question 2 : ipconfig ou ip addr montre-t-il une adresse 192.168.50.x, masque /24, passerelle .1 ? Si non : ② Question 3 : Le ping de la passerelle 192.168.50.1 répond-il ? Si non : Passerelle : box ou son raccordement, pare-feu du poste. Question 4 : Le ping du serveur 192.168.50.10 répond-il ? Si non : ③ Question 5 : Un site s&#x27;ouvre-t-il par son nom ? Si non : Internet : DNS du poste, box, liaison de l&#x27;opérateur. Question 6 : Le partage \\SRV-01\&lt;service&gt; s&#x27;ouvre-t-il avec le compte de la personne ? Si non : ④ Si toutes les réponses sont oui : Poste validé : noter les résultats sur la fiche de recette et passer au suivant.</desc><rect data-step="1" x="6" y="8" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="26" font-size="12" font-weight="700" text-anchor="start">1. Le voyant de la</text><text x="14" y="41" font-size="12" font-weight="700" text-anchor="start">carte et du port du</text><text x="14" y="56" font-size="12" font-weight="700" text-anchor="start">switch sont-ils</text><text x="14" y="71" font-size="12" font-weight="700" text-anchor="start">allumés ?</text><rect x="210" y="8" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="26" font-size="11.5" font-weight="400" text-anchor="start">①</text><path d="M184 52 H206" stroke="#33415c" stroke-width="2"/><path d="M200 46 L208 52 L200 58" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="67" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 98 V118" stroke="#33415c" stroke-width="2"/><path d="M89 112 L95 120 L101 112" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="114" font-size="10.5" font-weight="700">OUI</text><rect data-step="2" x="6" y="122" width="178" height="103" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="140" font-size="12" font-weight="700" text-anchor="start">2. ipconfig ou ip addr</text><text x="14" y="155" font-size="12" font-weight="700" text-anchor="start">montre-t-il une</text><text x="14" y="170" font-size="12" font-weight="700" text-anchor="start">adresse</text><text x="14" y="185" font-size="12" font-weight="700" text-anchor="start">192.168.50.x, masque</text><text x="14" y="200" font-size="12" font-weight="700" text-anchor="start">/24, passerelle .1 ?</text><rect x="210" y="122" width="164" height="103" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="140" font-size="11.5" font-weight="400" text-anchor="start">②</text><path d="M184 173 H206" stroke="#33415c" stroke-width="2"/><path d="M200 167 L208 173 L200 179" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="188" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 227 V247" stroke="#33415c" stroke-width="2"/><path d="M89 241 L95 249 L101 241" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="243" font-size="10.5" font-weight="700">OUI</text><rect data-step="3" x="6" y="251" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="269" font-size="12" font-weight="700" text-anchor="start">3. Le ping de la</text><text x="14" y="284" font-size="12" font-weight="700" text-anchor="start">passerelle</text><text x="14" y="299" font-size="12" font-weight="700" text-anchor="start">192.168.50.1</text><text x="14" y="314" font-size="12" font-weight="700" text-anchor="start">répond-il ?</text><rect x="210" y="251" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="269" font-size="11.5" font-weight="400" text-anchor="start">Passerelle : box ou</text><text x="218" y="284" font-size="11.5" font-weight="400" text-anchor="start">son raccordement,</text><text x="218" y="299" font-size="11.5" font-weight="400" text-anchor="start">pare-feu du poste.</text><path d="M184 295 H206" stroke="#33415c" stroke-width="2"/><path d="M200 289 L208 295 L200 301" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="310" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 341 V361" stroke="#33415c" stroke-width="2"/><path d="M89 355 L95 363 L101 355" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="357" font-size="10.5" font-weight="700">OUI</text><rect data-step="4" x="6" y="365" width="178" height="73" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="383" font-size="12" font-weight="700" text-anchor="start">4. Le ping du serveur</text><text x="14" y="398" font-size="12" font-weight="700" text-anchor="start">192.168.50.10</text><text x="14" y="413" font-size="12" font-weight="700" text-anchor="start">répond-il ?</text><rect x="210" y="365" width="164" height="73" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="383" font-size="11.5" font-weight="400" text-anchor="start">③</text><path d="M184 401 H206" stroke="#33415c" stroke-width="2"/><path d="M200 395 L208 401 L200 407" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="416" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 440 V460" stroke="#33415c" stroke-width="2"/><path d="M89 454 L95 462 L101 454" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="456" font-size="10.5" font-weight="700">OUI</text><rect data-step="5" x="6" y="464" width="178" height="69" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="482" font-size="12" font-weight="700" text-anchor="start">5. Un site s&#x27;ouvre-t-il</text><text x="14" y="497" font-size="12" font-weight="700" text-anchor="start">par son nom ?</text><rect x="210" y="464" width="164" height="69" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="482" font-size="11.5" font-weight="400" text-anchor="start">Internet : DNS du</text><text x="218" y="497" font-size="11.5" font-weight="400" text-anchor="start">poste, box, liaison de</text><text x="218" y="512" font-size="11.5" font-weight="400" text-anchor="start">l&#x27;opérateur.</text><path d="M184 498 H206" stroke="#33415c" stroke-width="2"/><path d="M200 492 L208 498 L200 504" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="513" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 535 V555" stroke="#33415c" stroke-width="2"/><path d="M89 549 L95 557 L101 549" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="551" font-size="10.5" font-weight="700">OUI</text><rect data-step="6" x="6" y="559" width="178" height="103" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="577" font-size="12" font-weight="700" text-anchor="start">6. Le partage</text><text x="14" y="592" font-size="12" font-weight="700" text-anchor="start">\\SRV-01\&lt;service&gt;</text><text x="14" y="607" font-size="12" font-weight="700" text-anchor="start">s&#x27;ouvre-t-il avec le</text><text x="14" y="622" font-size="12" font-weight="700" text-anchor="start">compte de la</text><text x="14" y="637" font-size="12" font-weight="700" text-anchor="start">personne ?</text><rect x="210" y="559" width="164" height="103" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="577" font-size="11.5" font-weight="400" text-anchor="start">④</text><path d="M184 610 H206" stroke="#33415c" stroke-width="2"/><path d="M200 604 L208 610 L200 616" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="625" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 664 V684" stroke="#33415c" stroke-width="2"/><path d="M89 678 L95 686 L101 678" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="680" font-size="10.5" font-weight="700">OUI</text><rect x="6" y="688" width="368" height="46" rx="8" fill="#e9f5ec" stroke="#2e6b3a" stroke-width="1.5"/><text x="14" y="706" font-size="12" font-weight="700" text-anchor="start">Poste validé : noter les résultats sur la fiche de</text><text x="14" y="722" font-size="12" font-weight="700" text-anchor="start">recette et passer au suivant.</text></svg>
