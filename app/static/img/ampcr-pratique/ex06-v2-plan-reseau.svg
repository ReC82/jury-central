<svg viewBox="0 0 380 538" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Variante 2, document 2 — Schéma du réseau de Imprimerie Dufour (schéma fictif)</title><desc>Réseau en étoile de Imprimerie Dufour : la box 10.20.0.1/24 (passerelle, DNS, DHCP, étendue 10.20.0.100 à 10.20.0.200) est reliée à un switch de 24 ports, qui relie : SRV-01 (serveur de fichiers) adresse 10.20.0.5, masque 255.255.255.0, passerelle 10.20.0.1 ; NAS-01 (sauvegardes) adresse 10.20.0.10, masque 255.255.255.0, passerelle 10.20.0.1 ; AP-01 (point d&#x27;accès Wi-Fi) adresse 10.20.0.20, masque 255.255.255.0, passerelle 10.20.0.1 ; IMP-01 (presse numérique) adresse 10.20.0.25, masque 255.255.255.0, passerelle 10.20.0.1 ; PC-PAO (mise en page (fixe)) adresse 10.20.0.30, masque 255.255.255.0, passerelle 10.20.0.1 ; PC-01…10 (postes de l&#x27;atelier et des bureaux) adresse par DHCP, passerelle 10.20.0.1. Hors switch, dans la atelier de façonnage, un segment coaxial relie PC-MASS1, PC-MASS2, PC-PLIEUSE, PC-ENCART. Le schéma ne donne aucun verdict.</desc><rect x="72" y="6" width="304" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="23" font-size="12" font-weight="700" text-anchor="start">BOX — passerelle, DNS, DHCP</text><text x="80" y="38" font-size="10.5" font-weight="400" text-anchor="start">LAN 10.20.0.1/24 · Internet 203.0.113.80</text><path d="M58 30 H72" stroke="#33415c" stroke-width="2"/><rect x="4" y="6" width="54" height="436" rx="8" fill="#e7ecf7" stroke="#33415c" stroke-width="1.5"/><text x="31" y="76" font-size="11.5" font-weight="700" text-anchor="middle">Switch</text><text x="31" y="92" font-size="10" font-weight="400" text-anchor="middle">24 ports</text><path d="M58 87 H72" stroke="#33415c" stroke-width="2"/><rect data-host="SRV-01" x="72" y="58" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="75" font-size="12" fon