<svg viewBox="0 0 380 329" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Imprimantes partagées à compléter</title><desc>PC-ACCUEIL (192.168.20.31) a l&#x27;imprimante Laser-Accueil en USB et la partage ; condition ① à compléter. Le serveur d&#x27;impression SRV-FICH (192.168.20.20) gère l&#x27;imprimante réseau IMP-COMPTA, adresse ② à compléter. Tous sont reliés au switch du réseau 192.168.20.0/24. Les postes clients se connectent à l&#x27;imprimante USB par le chemin ③ et à l&#x27;imprimante réseau par le chemin ④, à compléter.</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Imprimantes partagées</text><rect x="4" y="28" width="182" height="72" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="45" font-size="12" font-weight="700" text-anchor="start">PC-ACCUEIL</text><text x="12" y="60" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.20.31</text><text x="12" y="75" font-size="10.5" font-weight="400" text-anchor="start">USB → Laser-Accueil</text><text x="12" y="90" font-size="10.5" font-weight="400" text-anchor="start">① ?</text><rect data-node="serveur" x="194" y="28" width="182" height="72" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="202" y="45" font-size="12" font-weight="700" text-anchor="start">SRV-FICH</text><text x="202" y="60" font-size="10.5" font-weight="400" text-anchor="start">serveur d&#x27;impression</text><text x="202" y="75" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.20.20</text><text x="202" y="90" font-size="10.5" font-weight="400" text-anchor="start">file et pilote uniques</text><rect x="194" y="110" width="160" height="57" rx="7" fill="#fff3c4" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="202" y="127" font-size="12" font-weight="700" text-anchor="start">IMP-COMPTA</text><text x="202" y="142" font-size="10.5" font-weight="400" text-anchor="start">imprimante réseau</text><text x="202" y="157" font-size="10.5" font-weight="400" text-anchor="start">IP fixe ② ?</text><rect data-node="switch" x="4" y="178" width="372" height="22" rx="5" fill="#e7ecf7" stroke="#33415c" stroke-width="1.5"/><text x="190" y="193" font-size="11" font-weight="700" text-anchor="middle">Switch — réseau 192.168.20.0/24</text><path d="M95 100 V178" stroke="#33415c" stroke-width="2"/><path d="M274 167 V178" stroke="#33415c" stroke-width="2"/><path d="M368 100 V178" stroke="#33415c" stroke-width="2"/><rect x="4" y="214" width="372" height="57" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="231" font-size="12" font-weight="700" text-anchor="start">Postes clients (PC-01, PC-02…)</text><text x="12" y="246" font-size="10.5" font-weight="400" text-anchor="start">USB partagée : ③ ?</text><text x="12" y="261" font-size="10.5" font-weight="400" text-anchor="start">réseau : ④ ?</text><path d="M190 200 V214" stroke="#33415c" stroke-width="2"/><text x="8" y="290" font-size="10.5" font-weight="400" text-anchor="start">Une imprimante USB partagée n&#x27;imprime que si son poste hôte</text><text x="8" y="303" font-size="10.5" font-weight="400" text-anchor="start">est allumé. Une imprimante réseau garde une adresse fixe (ou</text><text x="8" y="316" font-size="10.5" font-weight="400" text-anchor="start">réservée en DHCP) : sinon elle passe « hors connexion ».</text></svg>
