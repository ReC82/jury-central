<svg viewBox="0 0 380 356" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Domaine à compléter</title><desc>Domaine ad.dupont.example en étoile autour d&#x27;un switch : la box 192.168.20.254 (passerelle vers Internet) ; le serveur DC01, rôle ① à compléter, adresse fixe ② à compléter/24, qui garde comptes, groupes et stratégies ; puis les postes membres du domaine : PC-01 192.168.20.11/24, DNS 192.168.20.10, passerelle 192.168.20.254 ; PC-02 192.168.20.12/24, DNS 192.168.20.10, passerelle 192.168.20.254 ; PC-03 192.168.20.13/24, DNS ③ à compléter, passerelle ④ à compléter.</desc><rect data-node="box" x="72" y="6" width="304" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="23" font-size="12" font-weight="700" text-anchor="start">Box — passerelle vers Internet</text><text x="80" y="38" font-size="10.5" font-weight="400" text-anchor="start">LAN : 192.168.20.254/24</text><rect x="72" y="52" width="304" height="57" rx="7" fill="#fff3c4" stroke="#33415c" stroke-width="1.5"/><text x="80" y="69" font-size="12" font-weight="700" text-anchor="start">DC01 — ① ?</text><text x="80" y="84" font-size="10.5" font-weight="400" text-anchor="start">IP fixe ② ?/24 · domaine ad.dupont.example</text><text x="80" y="99" font-size="10.5" font-weight="400" text-anchor="start">comptes, groupes, stratégies (DUPONT)</text><rect data-node="PC-01" x="72" y="116" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="133" font-size="12" font-weight="700" text-anchor="start">PC-01 — membre du domaine</text><text x="80" y="148" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.20.11/24 · DNS 192.168.20.10</text><text x="80" y="163" font-size="10.5" font-weight="400" text-anchor="start">passerelle 192.168.20.254</text><rect data-node="PC-02" x="72" y="179" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="196" font-size="12" font-weight="700" text-anchor="start">PC-02 — membre du domaine</text><text x="80" y="211" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.20.12/24 · DNS 192.168.20.10</text><text x="80" y="226" font-size="10.5" font-weight="400" text-anchor="start">passerelle 192.168.20.254</text><rect x="72" y="242" width="304" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="80" y="259" font-size="12" font-weight="700" text-anchor="start">PC-03 — membre du domaine</text><text x="80" y="274" font-size="10.5" font-weight="400" text-anchor="start">IP 192.168.20.13/24 · DNS ③ ?</text><text x="80" y="289" font-size="10.5" font-weight="400" text-anchor="start">passerelle ④ ?</text><rect data-node="switch" x="4" y="6" width="54" height="293" rx="8" fill="#e7ecf7" stroke="#33415c" stroke-width="1.5"/><text x="31" y="90" font-size="11.5" font-weight="700" text-anchor="middle">Switch</text><path d="M58 27 H72" stroke="#33415c" stroke-width="2"/><path d="M58 80 H72" stroke="#33415c" stroke-width="2"/><path d="M58 144 H72" stroke="#33415c" stroke-width="2"/><path d="M58 207 H72" stroke="#33415c" stroke-width="2"/><path d="M58 270 H72" stroke="#33415c" stroke-width="2"/><text x="8" y="317" font-size="10.5" font-weight="400" text-anchor="start">Les postes s&#x27;authentifient auprès du contrôleur (Kerberos)</text><text x="8" y="330" font-size="10.5" font-weight="400" text-anchor="start">et le trouvent par le DNS : leur DNS est le contrôleur, qui</text><text x="8" y="343" font-size="10.5" font-weight="400" text-anchor="start">relaie vers Internet. La box reste la passerelle.</text></svg>
