<svg viewBox="0 0 380 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Dossier C, document C5 — Réflectomètre sur la fibre 2, depuis le tiroir BUREAUX</title><desc>Trace de réflectomètre fictive, 1 550 nm, fibre 2 depuis le tiroir BUREAUX, bobine amorce de 150 m. Événements : 1. 150 m — pic de réflexion, perte 0,4 dB à 1 550 nm et 0,4 dB à 1 310 nm ; 2. 280 m — sans pic, perte 0,8 dB à 1 550 nm et 0,12 dB à 1 310 nm ; 3. 325 m — pic de réflexion, puis la trace retombe dans le bruit. Pente 0,4 dB/km. Aucune interprétation n&#x27;est donnée.</desc><text x="190" y="14" font-size="12" font-weight="700" text-anchor="middle">Trace : Tiroir BUREAUX → ENTREPÔT, fibre 2, 1 550 nm</text><path d="M40 22 V174 H366" fill="none" stroke="#33415c" stroke-width="1.2"/><text x="203" y="204" font-size="11" font-weight="400" text-anchor="middle">Distance depuis le réflectomètre (m)</text><text x="12" y="98" font-size="11" text-anchor="middle" transform="rotate(-90 12 98)">Niveau (dB)</text><path d="M40.0 174 v4" stroke="#33415c"/><text x="40" y="189" font-size="10" font-weight="400" text-anchor="middle">0</text><path d="M110.9 174 v4" stroke="#33415c"/><text x="110" y="189" font-size="10" font-weight="400" text-anchor="middle">100</text><path d="M181.7 174 v4" stroke="#33415c"/><text x="181" y="189" font-size="10" font-weight="400" text-anchor="middle">200</text><path d="M252.6 174 v4" stroke="#33415c"/><text x="252" y="189" font-size="10" font-weight="400" text-anchor="middle">300</text><path d="M323.5 174 v4" stroke="#33415c"/><text x="323" y="189" font-size="10" font-weight="400" text-anchor="middle">400</text><path data-trace="1" d="M40.0 59.9 L146.3 61.0 L146.3 32.6 L156.9 61.0 L156.9 68.6 L238.4 69.5 L238.4 84.6 L270.3 85.0 L270.3 56.6 L281.0 85.0 L281.0 160.7 L366.0 164.5" fill="none" stroke="#1f5fbf" stroke-width="2"/><rect x="40" y="22" width="106.3" height="152" fill="#f4f4f4" opacity="0.6"/><text x="93" y="168" font-size="10" font-weight="400" text-anchor="middle">amorce</text><g data-event="1" data-m="150"><circle cx="146.3" cy="30" r="8" fill="#ffffff" stroke="#33415c"/><text x="146.3" y="34" font-size="10.5" font-weight="700" text-anchor="middle">1</text></g><g data-event="2" data-m="280"><circle cx="238.4" cy="30" r="8" fill="#ffffff" stroke="#33415c"/><text x="238.4" y="34" font-size="10.5" font-weight="700" text-anchor="middle">2</text></g><g data-event="3" data-m="325"><circle cx="270.3" cy="30" r="8" fill="#ffffff" stroke="#33415c"/><text x="270.3" y="34" font-size="10.5" font-weight="700" text-anchor="middle">3</text></g><text x="10" y="218" font-size="11" font-weight="400" text-anchor="start">1. 150 m — pic de réflexion, perte 0,4 dB à 1 550 nm et 0,4 dB</text><text x="10" y="232" font-size="11" font-weight="400" text-anchor="start">à 1 310 nm</text><text x="10" y="246" font-size="11" font-weight="400" text-anchor="start">2. 280 m — sans pic, perte 0,8 dB à 1 550 nm et 0,12 dB à 1</text><text x="10" y="260" font-size="11" font-weight="400" text-anchor="start">310 nm</text><text x="10" y="274" font-size="11" font-weight="400" text-anchor="start">3. 325 m — pic de réflexion, puis la trace retombe dans le</text><text x="10" y="288" font-size="11" font-weight="400" text-anchor="start">bruit</text><text x="10" y="302" font-size="11" font-weight="400" text-anchor="start">Pente de la trace : 0,4 dB/km. Bobine amorce de 150 m entre le</text><text x="10" y="316" font-size="11" font-weight="400" text-anchor="start">réflectomètre et le tiroir BUREAUX.</text></svg>
