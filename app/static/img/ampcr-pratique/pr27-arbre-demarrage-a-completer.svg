<svg viewBox="0 0 380 628" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Arbre de démarrage à compléter</title><desc>Arbre de décision « Démarrage — le PC ne démarre pas jusqu&#x27;au système ». Départ : Écran noir, message du firmware ou redémarrage en boucle. 1. Un signe de vie à l&#x27;appui sur le bouton (voyant, ventilateur) ? Si non : ① 2. Une image s&#x27;affiche-t-elle (logo ou écran du firmware) ? Si non : Écran, câble et entrée, puis bips ou codes POST du manuel ; configuration minimale (PR06). 3. Le firmware détecte-t-il le disque système ? Si non : ② 4. Le disque système est-il le premier dans l&#x27;ordre de démarrage ? Si non : ③ 5. Le chargeur lance-t-il le système sans erreur ? Si non : ④ Si tout est oui : Le système démarre : poursuivre avec l&#x27;arbre « système » ou le symptôme de départ.</desc><rect data-step="1" x="6" y="8" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="26" font-size="12" font-weight="700" text-anchor="start">1. Un signe de vie à</text><text x="14" y="41" font-size="12" font-weight="700" text-anchor="start">l&#x27;appui sur le</text><text x="14" y="56" font-size="12" font-weight="700" text-anchor="start">bouton (voyant,</text><text x="14" y="71" font-size="12" font-weight="700" text-anchor="start">ventilateur) ?</text><rect x="210" y="8" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="26" font-size="11.5" font-weight="400" text-anchor="start">①</text><path d="M184 52 H206" stroke="#33415c" stroke-width="2"/><path d="M200 46 L208 52 L200 58" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="67" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 98 V118" stroke="#33415c" stroke-width="2"/><path d="M89 112 L95 120 L101 112" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="114" font-size="10.5" font-weight="700">OUI</text><rect data-step="2" x="6" y="122" width="178" height="99" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="140" font-size="12" font-weight="700" text-anchor="start">2. Une image</text><text x="14" y="155" font-size="12" font-weight="700" text-anchor="start">s&#x27;affiche-t-elle</text><text x="14" y="170" font-size="12" font-weight="700" text-anchor="start">(logo ou écran du</text><text x="14" y="185" font-size="12" font-weight="700" text-anchor="start">firmware) ?</text><rect x="210" y="122" width="164" height="99" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="140" font-size="11.5" font-weight="400" text-anchor="start">Écran, câble et</text><text x="218" y="155" font-size="11.5" font-weight="400" text-anchor="start">entrée, puis bips ou</text><text x="218" y="170" font-size="11.5" font-weight="400" text-anchor="start">codes POST du manuel ;</text><text x="218" y="185" font-size="11.5" font-weight="400" text-anchor="start">configuration minimale</text><text x="218" y="200" font-size="11.5" font-weight="400" text-anchor="start">(PR06).</text><path d="M184 171 H206" stroke="#33415c" stroke-width="2"/><path d="M200 165 L208 171 L200 177" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="186" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 223 V243" stroke="#33415c" stroke-width="2"/><path d="M89 237 L95 245 L101 237" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="239" font-size="10.5" font-weight="700">OUI</text><rect data-step="3" x="6" y="247" width="178" height="73" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="265" font-size="12" font-weight="700" text-anchor="start">3. Le firmware</text><text x="14" y="280" font-size="12" font-weight="700" text-anchor="start">détecte-t-il le</text><text x="14" y="295" font-size="12" font-weight="700" text-anchor="start">disque système ?</text><rect x="210" y="247" width="164" height="73" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="265" font-size="11.5" font-weight="400" text-anchor="start">②</text><path d="M184 283 H206" stroke="#33415c" stroke-width="2"/><path d="M200 277 L208 283 L200 289" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="298" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 322 V342" stroke="#33415c" stroke-width="2"/><path d="M89 336 L95 344 L101 336" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="338" font-size="10.5" font-weight="700">OUI</text><rect data-step="4" x="6" y="346" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="364" font-size="12" font-weight="700" text-anchor="start">4. Le disque système</text><text x="14" y="379" font-size="12" font-weight="700" text-anchor="start">est-il le premier</text><text x="14" y="394" font-size="12" font-weight="700" text-anchor="start">dans l&#x27;ordre de</text><text x="14" y="409" font-size="12" font-weight="700" text-anchor="start">démarrage ?</text><rect x="210" y="346" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="364" font-size="11.5" font-weight="400" text-anchor="start">③</text><path d="M184 390 H206" stroke="#33415c" stroke-width="2"/><path d="M200 384 L208 390 L200 396" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="405" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 436 V456" stroke="#33415c" stroke-width="2"/><path d="M89 450 L95 458 L101 450" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="452" font-size="10.5" font-weight="700">OUI</text><rect data-step="5" x="6" y="460" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="478" font-size="12" font-weight="700" text-anchor="start">5. Le chargeur</text><text x="14" y="493" font-size="12" font-weight="700" text-anchor="start">lance-t-il le</text><text x="14" y="508" font-size="12" font-weight="700" text-anchor="start">système sans erreur</text><text x="14" y="523" font-size="12" font-weight="700" text-anchor="start">?</text><rect x="210" y="460" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="478" font-size="11.5" font-weight="400" text-anchor="start">④</text><path d="M184 504 H206" stroke="#33415c" stroke-width="2"/><path d="M200 498 L208 504 L200 510" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="519" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 550 V570" stroke="#33415c" stroke-width="2"/><path d="M89 564 L95 572 L101 564" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="566" font-size="10.5" font-weight="700">OUI</text><rect x="6" y="574" width="368" height="46" rx="8" fill="#e9f5ec" stroke="#2e6b3a" stroke-width="1.5"/><text x="14" y="592" font-size="12" font-weight="700" text-anchor="start">Le système démarre : poursuivre avec l&#x27;arbre «</text><text x="14" y="608" font-size="12" font-weight="700" text-anchor="start">système » ou le symptôme de départ.</text></svg>
