<svg viewBox="0 0 380 489" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Arbre d&#x27;incident à compléter</title><desc>Arbre de décision « Incident pendant une intervention ». Départ : Choc électrique, fumée, blessure, pièce abîmée, données perdues ou exposées. 1. La zone est-elle sûre (ni fumée, ni flamme, ni contact électrique) ? Si non : ① 2. Tout le monde est-il indemne (aucun blessé) ? Si non : ② 3. Les données du client sont-elles intactes et sous contrôle ? Si non : ③ 4. Le matériel est-il intact ? Si non : ④ Si tout est oui : Noter l&#x27;incident sur la fiche (heure, faits, mesures), informer le client, analyser la cause avec le responsable.</desc><rect data-step="1" x="6" y="8" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="26" font-size="12" font-weight="700" text-anchor="start">1. La zone est-elle</text><text x="14" y="41" font-size="12" font-weight="700" text-anchor="start">sûre (ni fumée, ni</text><text x="14" y="56" font-size="12" font-weight="700" text-anchor="start">flamme, ni contact</text><text x="14" y="71" font-size="12" font-weight="700" text-anchor="start">électrique) ?</text><rect x="210" y="8" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="26" font-size="11.5" font-weight="400" text-anchor="start">①</text><path d="M184 52 H206" stroke="#33415c" stroke-width="2"/><path d="M200 46 L208 52 L200 58" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="67" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 98 V118" stroke="#33415c" stroke-width="2"/><path d="M89 112 L95 120 L101 112" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="114" font-size="10.5" font-weight="700">OUI</text><rect data-step="2" x="6" y="122" width="178" height="73" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="140" font-size="12" font-weight="700" text-anchor="start">2. Tout le monde est-il</text><text x="14" y="155" font-size="12" font-weight="700" text-anchor="start">indemne (aucun</text><text x="14" y="170" font-size="12" font-weight="700" text-anchor="start">blessé) ?</text><rect x="210" y="122" width="164" height="73" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="140" font-size="11.5" font-weight="400" text-anchor="start">②</text><path d="M184 158 H206" stroke="#33415c" stroke-width="2"/><path d="M200 152 L208 158 L200 164" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="173" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 197 V217" stroke="#33415c" stroke-width="2"/><path d="M89 211 L95 219 L101 211" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="213" font-size="10.5" font-weight="700">OUI</text><rect data-step="3" x="6" y="221" width="178" height="88" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="239" font-size="12" font-weight="700" text-anchor="start">3. Les données du</text><text x="14" y="254" font-size="12" font-weight="700" text-anchor="start">client sont-elles</text><text x="14" y="269" font-size="12" font-weight="700" text-anchor="start">intactes et sous</text><text x="14" y="284" font-size="12" font-weight="700" text-anchor="start">contrôle ?</text><rect x="210" y="221" width="164" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="239" font-size="11.5" font-weight="400" text-anchor="start">③</text><path d="M184 265 H206" stroke="#33415c" stroke-width="2"/><path d="M200 259 L208 265 L200 271" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="280" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 311 V331" stroke="#33415c" stroke-width="2"/><path d="M89 325 L95 333 L101 325" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="327" font-size="10.5" font-weight="700">OUI</text><rect data-step="4" x="6" y="335" width="178" height="58" rx="8" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="14" y="353" font-size="12" font-weight="700" text-anchor="start">4. Le matériel est-il</text><text x="14" y="368" font-size="12" font-weight="700" text-anchor="start">intact ?</text><rect x="210" y="335" width="164" height="58" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="218" y="353" font-size="11.5" font-weight="400" text-anchor="start">④</text><path d="M184 364 H206" stroke="#33415c" stroke-width="2"/><path d="M200 358 L208 364 L200 370" fill="none" stroke="#33415c" stroke-width="2"/><text x="197" y="379" font-size="10.5" font-weight="700" text-anchor="middle">NON</text><path d="M95 395 V415" stroke="#33415c" stroke-width="2"/><path d="M89 409 L95 417 L101 409" fill="none" stroke="#33415c" stroke-width="2"/><text x="103" y="411" font-size="10.5" font-weight="700">OUI</text><rect x="6" y="419" width="368" height="62" rx="8" fill="#e9f5ec" stroke="#2e6b3a" stroke-width="1.5"/><text x="14" y="437" font-size="12" font-weight="700" text-anchor="start">Noter l&#x27;incident sur la fiche (heure, faits,</text><text x="14" y="453" font-size="12" font-weight="700" text-anchor="start">mesures), informer le client, analyser la cause</text><text x="14" y="469" font-size="12" font-weight="700" text-anchor="start">avec le responsable.</text></svg>
