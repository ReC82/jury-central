<svg viewBox="0 0 380 393" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Architecture Wi-Fi à compléter</title><desc>Internet relié par câble à la box (192.168.20.1), rôle : ① à compléter. La box est reliée au switch PoE, qui relie le serveur SRV-01 (192.168.20.5), rôle : ② à compléter, et deux points d&#x27;accès câblés : AP-01 (192.168.20.30) au rez sur les canaux 1 et 36, et AP-02 (192.168.20.31) à l&#x27;étage sur les canaux 6 et 44, rôle : ③ à compléter. Le répéteur REP-01, dans l&#x27;annexe, est relié par radio à AP-02, rôle : ④ à compléter, même SSID. Les clients s&#x27;associent par radio au SSID ATELIER-PRO (réseau interne) ou ATELIER-INVITES (VLAN 30, réseau 10.30.0.0/24, isolé du réseau interne 192.168.20.0/24).</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Wi-Fi de l&#x27;atelier : qui fait quoi ?</text><rect x="4" y="26" width="110" height="42" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="11" y="43" font-size="11.5" font-weight="700" text-anchor="start">Internet</text><text x="11" y="57" font-size="10" font-weight="400" text-anchor="start">fournisseur d&#x27;accès</text><path d="M114 44 L140 44" stroke="#33415c" stroke-width="2" fill="none"/><rect x="140" y="26" width="236" height="42" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="147" y="43" font-size="11.5" font-weight="700" text-anchor="start">Box (192.168.20.1)</text><text x="147" y="57" font-size="10" font-weight="400" text-anchor="start">① ?</text><path d="M258 68 L258 90" stroke="#33415c" stroke-width="2" fill="none"/><rect x="140" y="90" width="236" height="42" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="147" y="107" font-size="11.5" font-weight="700" text-anchor="start">Switch PoE</text><text x="147" y="121" font-size="10" font-weight="400" text-anchor="start">relie tous les équipements câblés</text><path d="M140 108 L114 108" stroke="#33415c" stroke-width="2" fill="none"/><rect x="4" y="90" width="110" height="58" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="11" y="107" font-size="11.5" font-weight="700" text-anchor="start">SRV-01 (.5)</text><text x="11" y="121" font-size="10" font-weight="400" text-anchor="start">② ?</text><path d="M200 132 L200 160" stroke="#33415c" stroke-width="2" fill="none"/><path d="M320 132 L320 160" stroke="#33415c" stroke-width="2" fill="none"/><rect x="140" y="160" width="116" height="72" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="147" y="177" font-size="11.5" font-weight="700" text-anchor="start">AP-01 (.30)</text><text x="147" y="191" font-size="10" font-weight="400" text-anchor="start">câblé, PoE</text><text x="147" y="204" font-size="10" font-weight="400" text-anchor="start">rez-de-chaussée</text><text x="147" y="217" font-size="10" font-weight="400" text-anchor="start">canaux 1 et 36</text><rect x="262" y="160" width="114" height="72" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="269" y="177" font-size="11.5" font-weight="700" text-anchor="start">AP-02 (.31)</text><text x="269" y="191" font-size="10" font-weight="400" text-anchor="start">③ ?</text><text x="269" y="204" font-size="10" font-weight="400" text-anchor="start">étage : 6 et 44</text><path d="M319 232 L319 256" stroke="#33415c" stroke-width="2" stroke-dasharray="6 4" fill="none"/><rect x="222" y="256" width="154" height="72" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="229" y="273" font-size="11.5" font-weight="700" text-anchor="start">REP-01 (annexe)</text><text x="229" y="287" font-size="10" font-weight="400" text-anchor="start">④ ?</text><text x="229" y="300" font-size="10" font-weight="400" text-anchor="start">même SSID</text><path d="M198 232 L198 256" stroke="#33415c" stroke-width="2" stroke-dasharray="6 4" fill="none"/><rect x="4" y="256" width="210" height="72" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="11" y="273" font-size="11.5" font-weight="700" text-anchor="start">Clients (radio)</text><text x="11" y="287" font-size="10" font-weight="400" text-anchor="start">SSID ATELIER-PRO : réseau interne</text><text x="11" y="300" font-size="10" font-weight="400" text-anchor="start">SSID ATELIER-INVITES :</text><text x="11" y="313" font-size="10" font-weight="400" text-anchor="start">VLAN 30, isolé (10.30.0.0/24)</text><text x="8" y="348" font-size="10.5" font-weight="400" text-anchor="start">Trait plein = câble ; tirets = radio. Un SSID (nom du réseau)</text><text x="8" y="361" font-size="10.5" font-weight="400" text-anchor="start">est émis par plusieurs radios ; chaque radio a son BSSID</text><text x="8" y="374" font-size="10.5" font-weight="400" text-anchor="start">(adresse MAC). Un seul serveur DHCP par réseau.</text></svg>
