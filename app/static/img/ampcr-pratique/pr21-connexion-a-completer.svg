<svg viewBox="0 0 380 231" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Connexion directe à compléter</title><desc>Deux PC reliés par un seul câble, sans switch. PC-A : adresse 192.168.10.1, masque 255.255.255.0, passerelle vide, DNS vide. PC-B : adresse ① à compléter, masque ② à compléter, passerelle ③ à compléter, DNS vide. Le câble ④ est à choisir. Voyant de lien allumé des deux côtés.</desc><rect data-host="PC-A" x="4" y="8" width="168" height="102" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="12" y="25" font-size="12" font-weight="700" text-anchor="start">PC-A</text><text x="12" y="40" font-size="10.5" font-weight="400" text-anchor="start">IP : 192.168.10.1</text><text x="12" y="55" font-size="10.5" font-weight="400" text-anchor="start">Masque : 255.255.255.0</text><text x="12" y="70" font-size="10.5" font-weight="400" text-anchor="start">Passerelle : (vide)</text><text x="12" y="85" font-size="10.5" font-weight="400" text-anchor="start">DNS : (vide)</text><text x="12" y="100" font-size="10.5" font-weight="400" text-anchor="start">MAC 3C-52-82-4D-10-01</text><rect x="208" y="8" width="168" height="102" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="216" y="25" font-size="12" font-weight="700" text-anchor="start">PC-B</text><text x="216" y="40" font-size="10.5" font-weight="400" text-anchor="start">IP : ① ?</text><text x="216" y="55" font-size="10.5" font-weight="400" text-anchor="start">Masque : ② ?</text><text x="216" y="70" font-size="10.5" font-weight="400" text-anchor="start">Passerelle : ③ ?</text><text x="216" y="85" font-size="10.5" font-weight="400" text-anchor="start">DNS : (vide)</text><text x="216" y="100" font-size="10.5" font-weight="400" text-anchor="start">MAC A4-C3-F0-12-34-02</text><path data-cable="" d="M88 110 V134 H292 V110" fill="none" stroke="#33415c" stroke-width="3"/><circle data-led="lien" cx="102" cy="118" r="5" fill="#2e8b57" stroke="#33415c"/><circle data-led="lien" cx="306" cy="118" r="5" fill="#2e8b57" stroke="#33415c"/><text x="190" y="152" font-size="11.5" font-weight="700" text-anchor="middle">④ ?</text><text x="190" y="168" font-size="10.5" font-weight="400" text-anchor="middle">un seul câble RJ45, sans switch</text><text x="8" y="192" font-size="10.5" font-weight="400" text-anchor="start">Rond vert : voyant de lien allumé à côté de la prise de</text><text x="8" y="205" font-size="10.5" font-weight="400" text-anchor="start">chaque carte. Réseau 192.168.10.0/24 isolé : aucune</text><text x="8" y="218" font-size="10.5" font-weight="400" text-anchor="start">passerelle ni DNS n&#x27;est nécessaire.</text></svg>
