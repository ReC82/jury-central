<svg viewBox="0 0 380 289" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Plan de brassage à compléter</title><desc>Tableau des ports 01 à 08 du panneau 1 de la baie 1. port 01 : repère B1-P1-01 (P01), port 1 du switch ; port 02 : repère B1-P1-02 (P02), port 2 du switch ; port 03 : ① repère et port du switch à compléter ; port 04 : repère B1-P1-04 (P04), port 4 du switch ; port 05 : repère B1-P1-05 (P05), port 5 du switch ; port 06 : ② repère et port du switch à compléter ; port 07 : ③ repère et port du switch à compléter ; port 08 : repère B1-P1-08 (P08), port 8 du switch. Le port n du panneau est brassé sur le port n du switch.</desc><text x="190" y="16" font-size="12" font-weight="700" text-anchor="middle">Plan de brassage — baie 1, panneau 1</text><text x="14" y="36" font-size="10" font-weight="700" text-anchor="start">Port panneau</text><text x="104" y="36" font-size="10" font-weight="700" text-anchor="start">Repère (prise = panneau)</text><text x="268" y="36" font-size="10" font-weight="700" text-anchor="start">Port switch</text><rect data-row="1" data-label="B1-P1-01" x="8" y="44" width="364" height="21" rx="3" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><text x="40" y="59" font-size="11" font-weight="700" text-anchor="middle">01</text><text x="104" y="59" font-size="11" font-weight="400" text-anchor="start">B1-P1-01 (P01)</text><text x="300" y="59" font-size="11" font-weight="700" text-anchor="middle">1</text><path d="M232 54 H262" stroke="#33415c" stroke-width="1.5"/><rect data-row="2" data-label="B1-P1-02" x="8" y="68" width="364" height="21" rx="3" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><text x="40" y="83" font-size="11" font-weight="700" text-anchor="middle">02</text><text x="104" y="83" font-size="11" font-weight="400" text-anchor="start">B1-P1-02 (P02)</text><text x="300" y="83" font-size="11" font-weight="700" text-anchor="middle">2</text><path d="M232 78 H262" stroke="#33415c" stroke-width="1.5"/><rect data-row="3" data-label="" x="8" y="92" width="364" height="21" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1"/><text x="40" y="107" font-size="11" font-weight="700" text-anchor="middle">03</text><text x="104" y="107" font-size="11" font-weight="400" text-anchor="start">① ?</text><text x="300" y="107" font-size="11" font-weight="700" text-anchor="middle">?</text><path d="M232 102 H262" stroke="#33415c" stroke-width="1.5"/><rect data-row="4" data-label="B1-P1-04" x="8" y="116" width="364" height="21" rx="3" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><text x="40" y="131" font-size="11" font-weight="700" text-anchor="middle">04</text><text x="104" y="131" font-size="11" font-weight="400" text-anchor="start">B1-P1-04 (P04)</text><text x="300" y="131" font-size="11" font-weight="700" text-anchor="middle">4</text><path d="M232 126 H262" stroke="#33415c" stroke-width="1.5"/><rect data-row="5" data-label="B1-P1-05" x="8" y="140" width="364" height="21" rx="3" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><text x="40" y="155" font-size="11" font-weight="700" text-anchor="middle">05</text><text x="104" y="155" font-size="11" font-weight="400" text-anchor="start">B1-P1-05 (P05)</text><text x="300" y="155" font-size="11" font-weight="700" text-anchor="middle">5</text><path d="M232 150 H262" stroke="#33415c" stroke-width="1.5"/><rect data-row="6" data-label="" x="8" y="164" width="364" height="21" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1"/><text x="40" y="179" font-size="11" font-weight="700" text-anchor="middle">06</text><text x="104" y="179" font-size="11" font-weight="400" text-anchor="start">② ?</text><text x="300" y="179" font-size="11" font-weight="700" text-anchor="middle">?</text><path d="M232 174 H262" stroke="#33415c" stroke-width="1.5"/><rect data-row="7" data-label="" x="8" y="188" width="364" height="21" rx="3" fill="#ffffff" stroke="#33415c" stroke-width="1"/><text x="40" y="203" font-size="11" font-weight="700" text-anchor="middle">07</text><text x="104" y="203" font-size="11" font-weight="400" text-anchor="start">③ ?</text><text x="300" y="203" font-size="11" font-weight="700" text-anchor="middle">?</text><path d="M232 198 H262" stroke="#33415c" stroke-width="1.5"/><rect data-row="8" data-label="B1-P1-08" x="8" y="212" width="364" height="21" rx="3" fill="#f4f6fb" stroke="#33415c" stroke-width="1"/><text x="40" y="227" font-size="11" font-weight="700" text-anchor="middle">08</text><text x="104" y="227" font-size="11" font-weight="400" text-anchor="start">B1-P1-08 (P08)</text><text x="300" y="227" font-size="11" font-weight="700" text-anchor="middle">8</text><path d="M232 222 H262" stroke="#33415c" stroke-width="1.5"/><text x="10" y="250" font-size="10.5" font-weight="400" text-anchor="start">Convention du cours : le port n du panneau est brassé sur le</text><text x="10" y="263" font-size="10.5" font-weight="400" text-anchor="start">port n du switch ; la prise porte le même repère que le port</text><text x="10" y="276" font-size="10.5" font-weight="400" text-anchor="start">du panneau (baie, panneau, port).</text></svg>
