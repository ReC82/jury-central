<svg viewBox="0 0 380 313" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Variante 1, document 21 — Plan Wi-Fi et points de mesure (schéma fictif)</title><desc>Plan Wi-Fi de Atelier d&#x27;architecture Morel, non à l&#x27;échelle : le point d&#x27;accès AP-01 est à l&#x27;accueil (20 dBm rayonnés, 2,4 et 5 GHz). Points de mesure : P1, Salle de réunion, à 9 m, à travers cloison ; P2, Bureau des stagiaires, à 16 m, à travers 2 × mur de briques ; P3, Mezzanine (étage), à 14 m, à travers dalle d&#x27;étage, cloison. Zone à couvrir en priorité : Mezzanine (étage). Aucun niveau de signal n&#x27;est indiqué.</desc><rect x="4" y="6" width="372" height="261" rx="8" fill="#f7f8fb" stroke="#33415c" stroke-width="1.5"/><circle cx="40" cy="38" r="21" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="40" y="42" font-size="9.5" font-weight="700" text-anchor="middle">AP-01</text><text x="66" y="36" font-size="10.5" font-weight="400" text-anchor="start">Point d&#x27;accès AP-01 (accueil)</text><text x="66" y="50" font-size="10.5" font-weight="400" text-anchor="start">20 dBm rayonnés, 2,4 et 5 GHz</text><path d="M40 59 V96 H92" stroke="#33415c" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/><rect data-host="P1" x="92" y="82" width="276" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="100" y="99" font-size="12" font-weight="700" text-anchor="start">P1 — Salle de réunion</text><text x="100" y="114" font-size="10.5" font-weight="400" text-anchor="start">9 m du point d&#x27;accès</text><text x="100" y="129" font-size="10.5" font-weight="400" text-anchor="start">traverse : cloison</text><path d="M40 59 V158 H92" stroke="#33415c" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/><rect data-host="P2" x="92" y="144" width="276" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="100" y="161" font-size="12" font-weight="700" text-anchor="start">P2 — Bureau des stagiaires</text><text x="100" y="176" font-size="10.5" font-weight="400" text-anchor="start">16 m du point d&#x27;accès</text><text x="100" y="191" font-size="10.5" font-weight="400" text-anchor="start">traverse : 2 × mur de briques</text><path d="M40 59 V220 H92" stroke="#33415c" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/><rect data-host="P3" x="92" y="206" width="276" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="100" y="223" font-size="12" font-weight="700" text-anchor="start">P3 — Mezzanine (étage)</text><text x="100" y="238" font-size="10.5" font-weight="400" text-anchor="start">14 m du point d&#x27;accès</text><text x="100" y="253" font-size="10.5" font-weight="400" text-anchor="start">traverse : dalle d&#x27;étage, cloison</text><text x="8" y="287" font-size="10.5" font-weight="400" text-anchor="start">Zone à couvrir en priorité : Mezzanine (étage). Plan non à</text><text x="8" y="300" font-size="10.5" font-weight="400" text-anchor="start">l&#x27;échelle.</text></svg>
