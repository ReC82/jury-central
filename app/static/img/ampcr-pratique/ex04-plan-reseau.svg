<svg viewBox="0 0 380 311" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Document 1 — Plan du réseau de l&#x27;entreprise (schéma fictif)</title><desc>Plan d&#x27;un réseau : le routeur R1 est relié à deux switchs, SW1 et SW2. SW1 relie PC1, PC2 et un hub ; le hub relie PC3, PC4 et PC5. SW2 relie PC6 et PC7. Une ligne représente un câble. Le schéma ne donne aucun nombre de domaines.</desc><path data-link="R1-SW1" data-collision="" d="M190 34 L95 104" stroke="#33415c" stroke-width="1.6"/><path data-link="R1-SW2" data-collision="" d="M190 34 L300 104" stroke="#33415c" stroke-width="1.6"/><path data-link="SW1-PC1" data-collision="" d="M95 104 L25 178" stroke="#33415c" stroke-width="1.6"/><path data-link="SW1-PC2" data-collision="" d="M95 104 L72 178" stroke="#33415c" stroke-width="1.6"/><path data-link="SW1-HUB" data-collision="" d="M95 104 L150 178" stroke="#33415c" stroke-width="1.6"/><path data-link="HUB-PC3" data-collision="" d="M150 178 L105 250" stroke="#33415c" stroke-width="1.6"/><path data-link="HUB-PC4" data-collision="" d="M150 178 L150 250" stroke="#33415c" stroke-width="1.6"/><path data-link="HUB-PC5" data-collision="" d="M150 178 L195 250" stroke="#33415c" stroke-width="1.6"/><path data-link="SW2-PC6" data-collision="" d="M300 104 L265 178" stroke="#33415c" stroke-width="1.6"/><path data-link="SW2-PC7" data-collision="" d="M300 104 L340 178" stroke="#33415c" stroke-width="1.6"/><rect data-device="R1" data-kind="routeur" x="168.0" y="23" width="44" height="22" rx="4" fill="#fff3c4" stroke="#33415c" stroke-width="1.4"/><text x="190" y="38" font-size="9.5" font-weight="700" text-anchor="middle">R1</text><rect data-device="SW1" data-kind="switch" x="73.0" y="93" width="44" height="22" rx="4" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="95" y="108" font-size="9.5" font-weight="700" text-anchor="middle">SW1</text><rect data-device="SW2" data-kind="switch" x="278.0" y="93" width="44" height="22" rx="4" fill="#dbe4f3" stroke="#33415c" stroke-width="1.4"/><text x="300" y="108" font-size="9.5" font-weight="700" text-anchor="middle">SW2</text><rect data-device="PC1" data-kind="pc" x="7.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="25" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC1</text><rect data-device="PC2" data-kind="pc" x="54.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="72" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC2</text><rect data-device="HUB" data-kind="hub" x="128.0" y="167" width="44" height="22" rx="4" fill="#f6d9d6" stroke="#33415c" stroke-width="1.4"/><text x="150" y="182" font-size="9.5" font-weight="700" text-anchor="middle">HUB</text><rect data-device="PC3" data-kind="pc" x="87.0" y="239" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="105" y="254" font-size="9.5" font-weight="700" text-anchor="middle">PC3</text><rect data-device="PC4" data-kind="pc" x="132.0" y="239" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="150" y="254" font-size="9.5" font-weight="700" text-anchor="middle">PC4</text><rect data-device="PC5" data-kind="pc" x="177.0" y="239" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="195" y="254" font-size="9.5" font-weight="700" text-anchor="middle">PC5</text><rect data-device="PC6" data-kind="pc" x="247.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="265" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC6</text><rect data-device="PC7" data-kind="pc" x="322.0" y="167" width="36" height="22" rx="4" fill="#f4f6fb" stroke="#33415c" stroke-width="1.4"/><text x="340" y="182" font-size="9.5" font-weight="700" text-anchor="middle">PC7</text><text x="8" y="298" font-size="10.5" font-weight="400" text-anchor="start">R : routeur ; SW : switch ; HUB : hub ; PC : poste.</text></svg>
