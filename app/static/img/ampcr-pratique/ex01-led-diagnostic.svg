<svg viewBox="0 0 380 150" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>LED de diagnostic relevées sur le poste PC-COMPTA-03 (dossier A, fictif)</title><desc>Quatre voyants de diagnostic de la carte mère, de gauche à droite : CPU éteinte ; DRAM allumée fixe ; VGA éteinte ; BOOT éteinte. Ventilateurs en rotation, aucune image.</desc><rect x="2" y="24" width="376" height="124" rx="6" fill="#eef3ee" stroke="#2e6b3a" stroke-width="2"/><text x="190" y="15" font-size="12.5" font-weight="700" text-anchor="middle">LED de diagnostic de la carte mère (relevé fictif)</text><circle data-led="CPU" data-lit="false" cx="62" cy="66" r="16" fill="#ffffff" stroke="#33415c" stroke-width="2"/><text x="62" y="106" font-size="13" font-weight="700" text-anchor="middle">CPU</text><text x="62" y="126" font-size="11.5" text-anchor="middle">éteinte</text><circle data-led="DRAM" data-lit="true" cx="148" cy="66" r="16" fill="#f59e0b" stroke="#33415c" stroke-width="2"/><text x="148" y="106" font-size="13" font-weight="700" text-anchor="middle">DRAM</text><text x="148" y="126" font-size="11.5" text-anchor="middle">allumée fixe</text><circle data-led="VGA" data-lit="false" cx="232" cy="66" r="16" fill="#ffffff" stroke="#33415c" stroke-width="2"/><text x="232" y="106" font-size="13" font-weight="700" text-anchor="middle">VGA</text><text x="232" y="126" font-size="11.5" text-anchor="middle">éteinte</text><circle data-led="BOOT" data-lit="false" cx="318" cy="66" r="16" fill="#ffffff" stroke="#33415c" stroke-width="2"/><text x="318" y="106" font-size="13" font-weight="700" text-anchor="middle">BOOT</text><text x="318" y="126" font-size="11.5" text-anchor="middle">éteinte</text></svg>
