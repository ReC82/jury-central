<svg viewBox="0 0 380 407" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Fiche des groupes à compléter</title><desc>Trois chaînes comptes → groupe → dossier et droit : Comptabilité (jmartin, lbernard) → groupe ① à compléter → Compta : Modification ; Direction (cdupont) → groupe G_Direction → droits ② à compléter ; tous les comptes du domaine → groupe Utilisateurs du domaine → Commun : Modification. À la jonction : DUPONT\Admins du domaine devient membre du groupe local ③ ; DUPONT\Utilisateurs du domaine devient membre du groupe local ④.</desc><text x="190" y="16" font-size="12.5" font-weight="700" text-anchor="middle">Les droits passent par les groupes</text><rect x="4" y="28" width="108" height="72" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="12" y="45" font-size="12" font-weight="700" text-anchor="start">Comptes</text><text x="12" y="60" font-size="10.5" font-weight="400" text-anchor="start">Comptabilité :</text><text x="12" y="75" font-size="10.5" font-weight="400" text-anchor="start">jmartin,</text><text x="12" y="90" font-size="10.5" font-weight="400" text-anchor="start">lbernard</text><path d="M112 50 H124" stroke="#33415c" stroke-width="2"/><rect x="124" y="28" width="120" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="132" y="45" font-size="12" font-weight="700" text-anchor="start">Groupe</text><text x="132" y="60" font-size="10.5" font-weight="400" text-anchor="start">① ?</text><path d="M244 50 H256" stroke="#33415c" stroke-width="2"/><rect x="256" y="28" width="120" height="57" rx="7" fill="#e9f5ec" stroke="#33415c" stroke-width="1.5"/><text x="264" y="45" font-size="12" font-weight="700" text-anchor="start">Dossier : droit</text><text x="264" y="60" font-size="10.5" font-weight="400" text-anchor="start">Compta :</text><text x="264" y="75" font-size="10.5" font-weight="400" text-anchor="start">Modification</text><rect x="4" y="110" width="108" height="57" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="12" y="127" font-size="12" font-weight="700" text-anchor="start">Comptes</text><text x="12" y="142" font-size="10.5" font-weight="400" text-anchor="start">Direction :</text><text x="12" y="157" font-size="10.5" font-weight="400" text-anchor="start">cdupont</text><path d="M112 132 H124" stroke="#33415c" stroke-width="2"/><rect data-node="G_Direction" x="124" y="110" width="120" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="132" y="127" font-size="12" font-weight="700" text-anchor="start">Groupe</text><text x="132" y="142" font-size="10.5" font-weight="400" text-anchor="start">G_Direction</text><path d="M244 132 H256" stroke="#33415c" stroke-width="2"/><rect x="256" y="110" width="120" height="42" rx="7" fill="#ffffff" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="264" y="127" font-size="12" font-weight="700" text-anchor="start">Dossier : droit</text><text x="264" y="142" font-size="10.5" font-weight="400" text-anchor="start">② ?</text><rect x="4" y="177" width="108" height="57" rx="7" fill="#f4f6fb" stroke="#33415c" stroke-width="1.5"/><text x="12" y="194" font-size="12" font-weight="700" text-anchor="start">Comptes</text><text x="12" y="209" font-size="10.5" font-weight="400" text-anchor="start">Tous les comptes</text><text x="12" y="224" font-size="10.5" font-weight="400" text-anchor="start">du domaine</text><path d="M112 199 H124" stroke="#33415c" stroke-width="2"/><rect data-node="Utilisateurs du domaine" x="124" y="177" width="120" height="57" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5"/><text x="132" y="194" font-size="12" font-weight="700" text-anchor="start">Groupe</text><text x="132" y="209" font-size="10.5" font-weight="400" text-anchor="start">Utilisateurs du</text><text x="132" y="224" font-size="10.5" font-weight="400" text-anchor="start">domaine</text><path d="M244 199 H256" stroke="#33415c" stroke-width="2"/><rect x="256" y="177" width="120" height="57" rx="7" fill="#e9f5ec" stroke="#33415c" stroke-width="1.5"/><text x="264" y="194" font-size="12" font-weight="700" text-anchor="start">Dossier : droit</text><text x="264" y="209" font-size="10.5" font-weight="400" text-anchor="start">Commun :</text><text x="264" y="224" font-size="10.5" font-weight="400" text-anchor="start">Modification</text><text x="8" y="252" font-size="11" font-weight="700" text-anchor="start">À la jonction, sur chaque poste du domaine :</text><rect x="4" y="262" width="372" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="279" font-size="12" font-weight="700" text-anchor="start">DUPONT\Admins du domaine</text><text x="12" y="294" font-size="10.5" font-weight="400" text-anchor="start">→ devient membre du groupe local ③ ?</text><rect x="4" y="310" width="372" height="42" rx="7" fill="#dbe4f3" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="12" y="327" font-size="12" font-weight="700" text-anchor="start">DUPONT\Utilisateurs du domaine</text><text x="12" y="342" font-size="10.5" font-weight="400" text-anchor="start">→ devient membre du groupe local ④ ?</text><text x="8" y="368" font-size="10.5" font-weight="400" text-anchor="start">Arrivée ou départ d&#x27;une personne : on change ses groupes,</text><text x="8" y="381" font-size="10.5" font-weight="400" text-anchor="start">jamais les droits des dossiers. Un ajout à un groupe compte</text><text x="8" y="394" font-size="10.5" font-weight="400" text-anchor="start">à la prochaine ouverture de session.</text></svg>
