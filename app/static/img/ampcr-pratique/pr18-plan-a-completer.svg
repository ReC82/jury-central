<svg viewBox="0 0 380 307" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1b2333"><title>Plan des locaux à compléter</title><desc>Plan à l&#x27;échelle du cabinet de 24 m sur 14 m, sans équipement : Accueil, Bureau 1, Bureau 2, Réunion, Local technique, Sanitaires, Plateau. Cinq emplacements numérotés : ① au milieu du local technique, contre le mur ; ② dans le local technique, là où arrive la ligne de l&#x27;opérateur ; ③ au plafond, au centre du plateau ; ④ contre le mur de l&#x27;accueil, près du bureau d&#x27;accueil ; ⑤ dans un angle de l&#x27;accueil, près de l&#x27;emplacement prévu pour l&#x27;imprimante.</desc><text x="190" y="16" font-size="11.5" font-weight="700" text-anchor="middle">Cabinet d&#x27;expertise comptable</text><rect data-room="Accueil" x="10.0" y="28.0" width="120.0" height="105.0" fill="#f7f8fb" stroke="#33415c" stroke-width="1.5"/><text x="70" y="84" font-size="10" font-weight="400" text-anchor="middle">Accueil</text><rect data-room="Bureau 1" x="130.0" y="28.0" width="120.0" height="105.0" fill="#f7f8fb" stroke="#33415c" stroke-width="1.5"/><text x="190" y="84" font-size="10" font-weight="400" text-anchor="middle">Bureau 1</text><rect data-room="Bureau 2" x="250.0" y="28.0" width="120.0" height="105.0" fill="#f7f8fb" stroke="#33415c" stroke-width="1.5"/><text x="310" y="84" font-size="10" font-weight="400" text-anchor="middle">Bureau 2</text><rect data-room="Réunion" x="10.0" y="133.0" width="150.0" height="105.0" fill="#f7f8fb" stroke="#33415c" stroke-width="1.5"/><text x="85" y="189" font-size="10" font-weight="400" text-anchor="middle">Réunion</text><rect data-room="Local technique" x="160.0" y="133.0" width="45.0" height="45.0" fill="#f7f8fb" stroke="#33415c" stroke-width="1.5"/><text x="182" y="146" font-size="10" font-weight="400" text-anchor="middle">LT</text><rect data-room="Sanitaires" x="160.0" y="178.0" width="45.0" height="60.0" fill="#f7f8fb" stroke="#33415c" stroke-width="1.5"/><text x="182" y="191" font-size="10" font-weight="400" text-anchor="middle">WC</text><rect data-room="Plateau" x="205.0" y="133.0" width="165.0" height="105.0" fill="#f7f8fb" stroke="#33415c" stroke-width="1.5"/><text x="287" y="189" font-size="10" font-weight="400" text-anchor="middle">Plateau</text><g data-marker="①"><circle cx="182.5" cy="155.5" r="9" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="182.5" y="159.5" font-size="11" font-weight="700" text-anchor="middle">①</text></g><g data-marker="②"><circle cx="167.5" cy="172.0" r="9" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="167.5" y="176.0" font-size="11" font-weight="700" text-anchor="middle">②</text></g><g data-marker="③"><circle cx="317.5" cy="170.5" r="9" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="317.5" y="174.5" font-size="11" font-weight="700" text-anchor="middle">③</text></g><g data-marker="④"><circle cx="43.0" cy="122.5" r="9" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="43.0" y="126.5" font-size="11" font-weight="700" text-anchor="middle">④</text></g><g data-marker="⑤"><circle cx="122.5" cy="46.0" r="9" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="122.5" y="50.0" font-size="11" font-weight="700" text-anchor="middle">⑤</text></g><path d="M10 248 h15" stroke="#33415c" stroke-width="2"/><text x="31" y="252" font-size="10" font-weight="400" text-anchor="start">1 m</text><text x="10" y="268" font-size="10.5" font-weight="400" text-anchor="start">Échelle : le trait ci-dessus mesure 1 m ; plan de 24 m × 14 m.</text><text x="10" y="281" font-size="10.5" font-weight="400" text-anchor="start">LT : local technique; WC : sanitaires.</text><text x="10" y="294" font-size="10.5" font-weight="400" text-anchor="start">Cercles numérotés : emplacements à compléter.</text></svg>
