{% extends "base.html" %}

{% block title %}Admin — Matières{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin/dashboard">Admin</a></li>
        <li class="breadcrumb-item active" aria-current="page">Matières</li>
    </ol>
</nav>

<h1 class="h3 mb-4">Matières</h1>

<div class="list-group">
    {% for subject in subjects %}
    <a
        href="/admin/subjects/{{ subject.id }}"
        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        {{ subject.name }}
        <span class="badge text-bg-secondary">{{ subject.modules|length }} module(s)</span>
    </a>
    {% else %}
    <p class="text-muted">Aucune matière.</p>
    {% endfor %}
</div>
{% endblock %}
