{% extends "base.html" %}

{% block title %}{{ document.title or "Document" }} — Jury Central{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-7">

        <p class="text-uppercase text-muted small fw-semibold mb-1">Document de référence</p>
        <h1 class="h4 mb-3">📄 {{ document.title or "Document source" }}</h1>

        <div class="p-3 bg-white rounded shadow-sm mb-3" style="white-space: pre-line;">{{ document.content_text }}</div>

        <div class="text-center d-print-none">
            <a href="/" class="btn btn-outline-dark">Retour à l'accueil</a>
        </div>
    </div>
</div>
{% endblock %}
