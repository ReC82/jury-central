{% extends "base.html" %}
{% import "_document_layouts.html" as sd %}

{% block title %}{{ document.title or "Document" }} — Jury Central{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-10 col-xl-9">

        {{ sd.render(document, "Document de référence", uid="v", show_open=False) }}

        <div class="d-flex justify-content-center gap-2 mt-3 d-print-none">
            <button type="button" class="btn btn-outline-dark" onclick="window.print()"><i class="bi bi-printer" aria-hidden="true"></i> Imprimer</button>
            <a href="/" class="btn btn-outline-secondary">Retour à l'accueil</a>
        </div>
    </div>
</div>
{% endblock %}
