{% extends "base.html" %}

{% block title %}Tableau de bord admin — Jury Central{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Tableau de bord</h1>
    <a href="/admin/logout" class="btn btn-outline-secondary btn-sm">Se déconnecter</a>
</div>

<p class="text-muted">Connecté en tant que <strong>{{ username }}</strong>.</p>

<div class="row g-3">
    <div class="col-12 col-sm-4">
        <div class="p-3 bg-white rounded shadow-sm text-center">
            <div class="fs-3 fw-bold">{{ subject_count }}</div>
            <div class="text-muted small">Matières</div>
        </div>
    </div>
    <div class="col-12 col-sm-4">
        <div class="p-3 bg-white rounded shadow-sm text-center">
            <div class="fs-3 fw-bold">{{ module_count }}</div>
            <div class="text-muted small">Modules</div>
        </div>
    </div>
    <div class="col-12 col-sm-4">
        <div class="p-3 bg-white rounded shadow-sm text-center">
            <div class="fs-3 fw-bold">{{ uaa_count }}</div>
            <div class="text-muted small">UAA</div>
        </div>
    </div>
</div>
{% endblock %}
