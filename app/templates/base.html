<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Jury Central{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='css/design-system.css') }}" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [["$", "$"], ["\\(", "\\)"]],
                displayMath: [["$$", "$$"], ["\\[", "\\]"]]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark d-print-none">
        <div class="container">
            <a class="navbar-brand" href="/">Jury Central</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Afficher/masquer la navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/subjects">Matières</a>
                    </li>
                    {% if current_user %}
                    <li class="nav-item">
                        <a class="nav-link" href="/mes-sessions">Mes entraînements</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/account">
                            {{ current_user.display_name or current_user.email }}
                        </a>
                    </li>
                    <li class="nav-item d-flex align-items-center px-3 px-md-2">
                        <form method="post" action="/logout" class="m-0">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                            <button type="submit" class="btn btn-sm jc-nav-logout">
                                Déconnexion
                            </button>
                        </form>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Connexion</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/register">Créer un compte</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1 py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light border-top py-3 mt-auto d-print-none">
        <div class="container text-center text-muted small">
            &copy; 2026 Jury Central
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="{{ url_for('static', path='js/design_system.js') }}"></script>
    <script src="{{ url_for('static', path='js/rich_content.js') }}"></script>
    <script src="{{ url_for('static', path='js/exercise.js') }}"></script>
    <script src="{{ url_for('static', path='js/quiz.js') }}"></script>
    <script src="{{ url_for('static', path='js/progress.js') }}"></script>
    <script src="{{ url_for('static', path='js/value_table.js') }}"></script>
    <script src="{{ url_for('static', path='js/ai_exercise.js') }}"></script>
    <script src="{{ url_for('static', path='js/editorial_exercise.js') }}"></script>
</body>
</html>
